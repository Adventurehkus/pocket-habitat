name: Autonomous Roblox Builder

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the autonomous development pipeline
        required: true
        type: string
        default: "Read the project state and roadmap. Complete the highest-priority unfinished task, then keep advancing through meaningful reviewed vertical slices until the workflow's quota-exhaustion target or a hard safety budget is reached."
      is_continuation:
        description: "Internal handoff marker; managed by automatic continuation."
        required: false
        type: string
        default: "false"
      exhausted_quota_pools:
        description: "Legacy quota state from older continuation runs; managed automatically."
        required: false
        type: string
        default: ""
      quota_pool_resets:
        description: "Provider-aware quota pool reset timestamps; managed automatically by continuation runs."
        required: false
        type: string
        default: ""
      monthly_quota_pools:
        description: "Quota pools exhausted by monthly limits; carried forward but excluded from the daily resume gate."
        required: false
        type: string
        default: ""
      consecutive_no_progress_runs:
        description: "Internal circuit-breaker state for consecutive runs without a validated development cycle."
        required: false
        type: string
        default: "0"
      continuation_count:
        description: "Legacy compatibility input from older runs; ignored."
        required: false
        type: string
        default: "0"
      chain_started_at:
        description: "Legacy compatibility input from older runs; ignored."
        required: false
        type: string
        default: ""
      quota_day:
        description: "Legacy continuation marker from older UTC-day quota state; ignored for reset scheduling."
        required: false
        type: string
        default: ""

permissions:
  contents: write
  actions: write

concurrency:
  group: roblox-ai-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout AI build branch
        uses: actions/checkout@v7
        with:
          ref: ai/game-build
          persist-credentials: true

      - name: Install Roblox toolchain
        env:
          # Rokit's installer uses this token for authenticated GitHub release API requests.
          # This avoids anonymous API rate limits (HTTP 403) on fresh hosted runners.
          GITHUB_PAT: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit --version
          # The install script's GITHUB_PAT only authenticates the bootstrap download.
          # Persist the same short-lived Actions token in Rokit's own auth store so
          # release lookups for project tools (Rojo, StyLua, Selene) are authenticated.
          rokit authenticate github --token "$GITHUB_PAT"
          rokit install --no-trust-check
          wally install
          rojo --version
          stylua --version
          selene --version
          wally --version
          rojo build default.project.json -o "$RUNNER_TEMP/pocket-habitat-toolchain-check.rbxl"

      - name: Validate OpenCode model registry
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.providers.google.models and .providers.cohere.models and .providers.openrouter.models and .providers["cloudflare-workers-ai"].models' opencode.json >/dev/null
          jq -e '.providers.google.models["gemini-4-hydrogen"].limit.context == 1048576 and .providers.google.models["gemini-4-hydrogen"].limit.output == 65536 and .providers.google.models["gemini-4-hydrogen"].body.generationConfig.thinkingConfig.thinkingLevel == "HIGH"' opencode.json >/dev/null
          jq -e '.compaction.auto == true and .compaction.keep.tokens == 2000 and .compaction.buffer == "15%" and .providers.google.models["gemma-4-31b-it"].limit.context == 32768 and .providers.google.models["gemma-4-31b-it"].limit.input == 12000 and .providers.google.models["gemma-4-26b-a4b-it"].limit.input == 12000 and .providers.groq.models["qwen/qwen3.8-27b"].limit.context == 32768 and .providers.groq.models["qwen/qwen3.8-27b"].limit.input == 5000 and .providers.groq.models["openai/gpt-oss-120b"].limit.input == 6000 and .providers.groq.models["openai/gpt-oss-20b"].limit.input == 6000' opencode.json >/dev/null
          jq -e '.providers.groq.models["qwen/qwen3.8-27b"].limit.output == 800 and .providers.groq.models["openai/gpt-oss-120b"].limit.output == 800 and .providers.groq.models["openai/gpt-oss-20b"].limit.output == 800' opencode.json >/dev/null
          jq -e '.agents.compaction.model == "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free" and .providers.openrouter.models["nvidia/nemotron-3-ultra-550b-a55b:free"].limit.output >= 8192' opencode.json >/dev/null
          echo "Dedicated compaction model is configured with enough output headroom to summarize Groq sessions."
          echo "OpenCode context budgets are valid; Groq Qwen leaves input headroom and all Groq output caps remain below observed TPM/OTPM ceilings."

      - name: Test automatic continuation policy
        shell: bash
        run: bash .github/scripts/test-continuation-policy.sh

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version
          opencode run --help

          # Copilot Free is available as an optional CLI adapter, not an
          # OpenCode API model. Installation is best-effort.
          if curl -fsSL https://gh.io/copilot-install | bash; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
            if command -v copilot >/dev/null 2>&1; then
              copilot --version
            else
              echo "::warning::Copilot CLI executable not found; Copilot fallback will be unavailable."
            fi
          else
            echo "::warning::Copilot CLI installation failed; other providers remain available."
          fi

      - name: Run staged multi-agent development pipeline
        id: pipeline
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TASK: ${{ inputs.task }}
          IS_CONTINUATION_RUN: ${{ inputs.is_continuation == 'true' || inputs.quota_pool_resets != '' || inputs.monthly_quota_pools != '' || inputs.consecutive_no_progress_runs != '0' || inputs.quota_day != '' || inputs.exhausted_quota_pools != '' || inputs.continuation_count != '0' || inputs.chain_started_at != '' }}
          NO_PROGRESS_RUNS_BEFORE: ${{ inputs.consecutive_no_progress_runs }}
          QUOTA_STATE_DAY: ${{ inputs.quota_day }}
          EXHAUSTED_QUOTA_POOLS: ${{ inputs.exhausted_quota_pools }}
          QUOTA_POOL_RESETS: ${{ inputs.quota_pool_resets }}
          MONTHLY_QUOTA_POOLS: ${{ inputs.monthly_quota_pools }}
          NO_COLOR: "1"
        shell: bash
        run: |
          # Do not let one model's non-zero exit terminate the router before
          # its output can be classified. Every stage has its own fresh session.
          set +e
          set -uo pipefail

          mkdir -p build

          # The repository's evergreen handoff is maintained in AGENTS.md and
          # docs/. Avoid resending the entire handoff as a workflow_dispatch
          # input on every run; keep custom/user-supplied tasks untouched.
          if [[ "$TASK" == *"# POCKET HABITAT — EVERGREEN AUTONOMOUS DEVELOPMENT HANDOFF"* ]]; then
            TASK="Continue autonomous development of Pocket Habitat from the checked-out source. Read AGENTS.md and docs/AUTONOMOUS_AGENT_GUIDE.md, then inspect docs/PROJECT_STATE.md, docs/ROADMAP.md, docs/TECHNICAL_ARCHITECTURE.md, and docs/TESTING.md. Verify the highest-priority unfinished task against current source, implement one meaningful integrated vertical slice, preserve server authority/player-data safety/multiplayer isolation, run supported checks, and update the living docs accurately. Continue across meaningful tasks rather than planning only. The repository documents are the durable handoff; do not repeat or recreate an old milestone. Never publish, modify credentials/provider settings, edit vendored dependencies, or manually commit/push."
            echo "::notice::Compacted the recognized evergreen handoff input; permanent instructions remain in repository documentation."
          fi

          RUN_REPORT="$RUNNER_TEMP/pocket-habitat-agent-report.md"
          USAGE_LOG="$RUNNER_TEMP/pocket-habitat-model-usage.tsv"
          VALIDATION_LOG="$RUNNER_TEMP/pocket-habitat-validation.log"
          DIFF_FILE="$RUNNER_TEMP/pocket-habitat-implementation.diff"
          RECOVERY_CONTEXT_FILE="$GITHUB_WORKSPACE/docs/AUTONOMOUS_RECOVERY.md"
          RECOVERY_CONTEXT_MAX_BYTES=12000
          if [[ -f "$RECOVERY_CONTEXT_FILE" ]]; then
            RECOVERY_CONTEXT_BYTES="$(wc -c < "$RECOVERY_CONTEXT_FILE")"
            if (( RECOVERY_CONTEXT_BYTES > RECOVERY_CONTEXT_MAX_BYTES )); then
              mkdir -p "$GITHUB_WORKSPACE/docs/recovery-archive"
              RECOVERY_ARCHIVE="$GITHUB_WORKSPACE/docs/recovery-archive/AUTONOMOUS_RECOVERY_OVERFLOW_RUN_${GITHUB_RUN_NUMBER}.md"
              cp "$RECOVERY_CONTEXT_FILE" "$RECOVERY_ARCHIVE"
              cat > "$RECOVERY_CONTEXT_FILE" <<EOF
          # Pocket Habitat — Active Recovery Summary

          RECOVERY_STATUS: OPEN

          The previous recovery note exceeded the 12 KB prompt budget (${RECOVERY_CONTEXT_BYTES} bytes) and was moved to docs/recovery-archive/${RECOVERY_ARCHIVE##*/}.

          Inspect the active source, PROJECT_STATE.md, ROADMAP.md, and the archived history only when a specific historical detail is required. Do not attach or reproduce the archive in model prompts. Replace this file with a compact current issue summary as recovery proceeds.
          EOF
              echo "::warning::Compacted oversized recovery context (${RECOVERY_CONTEXT_BYTES} bytes) into a non-attached archive."
            fi
          fi
          echo "safe_to_persist=false" >> "$GITHUB_OUTPUT"
          printf 'round\tstage\tprovider\tmodel\tattempt\tresult\tdetail\n' > "$USAGE_LOG"

          # A successful model is used once per cycle for role separation, then
          # becomes eligible again in later cycles. Quota/cooldown state persists
          # across the entire workflow run.
          declare -A MODEL_ATTEMPTED=()
          declare -A MODEL_BLOCKED=()
          declare -A PROVIDER_BLOCKED=()
          declare -A MODEL_PERMANENTLY_INELIGIBLE=()
          declare -A PROVIDER_PERMANENTLY_INELIGIBLE=()
          declare -A MODEL_RUN_CALLS=()
          declare -A MODEL_STAGE_RETRIES=()
          declare -A MODEL_STAGE_TEMP_FAILURES=()
          declare -A MODEL_STAGE_EXHAUSTED=()
          declare -A MODEL_STAGE_OVERSIZE=()
          declare -A MODEL_COOLDOWN_UNTIL=()
          declare -A PROVIDER_COOLDOWN_UNTIL=()
          declare -A QUOTA_POOL_RESET_AT=()
          declare -A QUOTA_POOL_KEYS=()
          declare -A ROLE_LAST_MODEL=()
          declare -A MODEL_RUN_CAP_REACHED=()
          declare -A STAGE_STATUS=()
          declare -A STAGE_MODEL=()
          declare -A STAGE_PROVIDER=()
          declare -A STAGE_LOG=()
          MODEL_CHAIN=()
          STAGE_FILES=()
          RUN_COUNTER=0
          TOTAL_MODEL_CALLS=0
          PERSISTED_CYCLE_CHECKPOINTS=0
          PERSISTED_RECOVERY_CHECKPOINTS=0
          AUTONOMOUS_ROUNDS_COMPLETED=0
          AUTONOMOUS_RECOVERY_CYCLES=0
          VALIDATION_RECOVERY_CYCLES=0
          RECOVERY_CONTEXT_ACTIVE=false
          SAFE_TO_PERSIST=false
          if [[ -f "$RECOVERY_CONTEXT_FILE" ]] && ! grep -Eq '^RECOVERY_STATUS:[[:space:]]*RESOLVED[[:space:]]*$' "$RECOVERY_CONTEXT_FILE"; then
            RECOVERY_CONTEXT_ACTIVE=true
            echo "::warning::Found persisted autonomous recovery debt from a previous run. The next implementation pass must resolve it first."
          elif [[ -f "$RECOVERY_CONTEXT_FILE" ]]; then
            echo "::notice::Found a previously resolved recovery record. It is retained as audit evidence and will not block new tasks."
          fi
          AUTONOMOUS_STOP_REASON=""
          NO_PROGRESS_ROUNDS=0
          CONSECUTIVE_NO_PROGRESS_RUNS=0
          if [[ "${NO_PROGRESS_RUNS_BEFORE:-0}" =~ ^[0-9]+$ ]]; then
            CONSECUTIVE_NO_PROGRESS_RUNS="$NO_PROGRESS_RUNS_BEFORE"
          else
            echo "::warning::Invalid no-progress continuation state; resetting the circuit-breaker counter to zero."
          fi
          # Allow several bounded fresh runs to revisit still-eligible providers
          # after temporary TPM/capacity limits, without permitting an endless
          # zero-progress continuation chain.
          MAX_CONSECUTIVE_NO_PROGRESS_RUNS=5
          PIPELINE_EXIT=0
          IMPLEMENTATION_RETRYABLE_RUN_LIMIT=false
          # Each workflow execution has bounded local call, round, and wait budgets.
          # Eligible work can continue in fresh workflow executions without a
          # fixed cross-run count or wall-clock cutoff.
          MAX_MODEL_TEMP_ATTEMPTS=4
          MAX_STAGE_MODEL_CALLS=50
          MAX_MODEL_CALLS_PER_MODEL=8
          MAX_TOTAL_MODEL_CALLS=120
          MAX_AUTONOMOUS_ROUNDS=30
          MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS=2
          MAX_VALIDATION_REPAIR_ROUNDS_PER_CYCLE=5
          MAX_QA_REPAIR_ROUNDS_PER_CYCLE=3
          QUOTA_EXHAUSTION_TARGET_PERCENT=100
          STAGE_TEMP_WAIT_BUDGET_SECONDS=7200
          TOTAL_TEMP_WAIT_BUDGET_SECONDS=7200
          TOTAL_TEMP_WAIT_SECONDS=0
          TEMP_LIMIT_EVENTS=0
          QUOTA_EXHAUSTION_EVENTS=0
          QUOTA_POOL_COOLDOWN_COUNT=0
          ELIGIBLE_QUOTA_POOL_COUNT=0
          INELIGIBLE_QUOTA_POOL_COUNT=0
          QUOTA_EXHAUSTION_PERCENT=0
          QUOTA_TARGET_REACHED=false
          IMPLEMENT_PROVIDER=""
          REVIEW_PROVIDER=""
          REPAIR_PROVIDER=""

          provider_for_model() {
            case "$1" in
              google/*) echo "google" ;;
              groq/*) echo "groq" ;;
              openrouter/*) echo "openrouter" ;;
              cohere/*) echo "cohere" ;;
              cloudflare-workers-ai/*) echo "cloudflare-workers-ai" ;;
              github-copilot/*) echo "github-copilot" ;;
              *) echo "unknown" ;;
            esac
          }

          # OpenCode is launched with env -i so each session receives only the
          # credentials required by its primary provider and its configured
          # compaction model. Compaction can call a different provider from the
          # stage model, so omitting this second key causes misleading 403 errors
          # that the router can otherwise attribute to the primary provider.
          append_provider_credentials() {
            local -n args_ref="$1"
            local target_provider="$2"

            case "$target_provider" in
              google)
                [[ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ]] || return 1
                args_ref+=("GOOGLE_GENERATIVE_AI_API_KEY=$GOOGLE_GENERATIVE_AI_API_KEY")
                ;;
              groq)
                [[ -n "${GROQ_API_KEY:-}" ]] || return 1
                args_ref+=("GROQ_API_KEY=$GROQ_API_KEY")
                ;;
              openrouter)
                [[ -n "${OPENROUTER_API_KEY:-}" ]] || return 1
                args_ref+=("OPENROUTER_API_KEY=$OPENROUTER_API_KEY")
                ;;
              cohere)
                [[ -n "${COHERE_API_KEY:-}" ]] || return 1
                args_ref+=("COHERE_API_KEY=$COHERE_API_KEY")
                ;;
              cloudflare-workers-ai)
                [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]] || return 1
                args_ref+=("CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID" "CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN")
                ;;
              github-copilot)
                [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]] || return 1
                args_ref+=("COPILOT_GITHUB_TOKEN=$COPILOT_GITHUB_TOKEN")
                ;;
              *)
                return 1
                ;;
            esac
          }

          COMPACTION_MODEL="$(jq -r '.agents.compaction.model // empty' opencode.json)"
          COMPACTION_PROVIDER="$(provider_for_model "$COMPACTION_MODEL")"
          if [[ "$COMPACTION_PROVIDER" == "unknown" ]]; then
            COMPACTION_MODEL=""
            COMPACTION_PROVIDER=""
          fi

          # Test every credential mapping using dummy values; never print them.
          (
            GOOGLE_GENERATIVE_AI_API_KEY="test-google"
            GROQ_API_KEY="test-groq"
            OPENROUTER_API_KEY="test-openrouter"
            COHERE_API_KEY="test-cohere"
            CLOUDFLARE_ACCOUNT_ID="test-account"
            CLOUDFLARE_API_TOKEN="test-cloudflare"
            COPILOT_GITHUB_TOKEN="test-copilot"
            declare -a credential_test_args=()
            append_provider_credentials credential_test_args google || exit 1
            [[ "${credential_test_args[0]%%=*}" == "GOOGLE_GENERATIVE_AI_API_KEY" ]] || exit 1
            credential_test_args=()
            append_provider_credentials credential_test_args groq || exit 1
            [[ "${credential_test_args[0]%%=*}" == "GROQ_API_KEY" ]] || exit 1
            credential_test_args=()
            append_provider_credentials credential_test_args openrouter || exit 1
            [[ "${credential_test_args[0]%%=*}" == "OPENROUTER_API_KEY" ]] || exit 1
            credential_test_args=()
            append_provider_credentials credential_test_args cohere || exit 1
            [[ "${credential_test_args[0]%%=*}" == "COHERE_API_KEY" ]] || exit 1
            credential_test_args=()
            append_provider_credentials credential_test_args cloudflare-workers-ai || exit 1
            [[ "${#credential_test_args[@]}" -eq 2 ]] || exit 1
            credential_test_args=()
            append_provider_credentials credential_test_args github-copilot || exit 1
            [[ "${credential_test_args[0]%%=*}" == "COPILOT_GITHUB_TOKEN" ]] || exit 1
            credential_test_args=()
            if append_provider_credentials credential_test_args missing-provider; then exit 1; fi
          ) || {
            echo "::error::Provider credential-isolation regression tests failed."
            exit 1
          }
          echo "Provider credential-isolation tests passed for all configured providers."

          # Recompute active cooldowns after a complete model pass. A slow
          # provider response can outlast the first deadline observed in that
          # pass; retaining that stale minimum would suppress every later wait.
          earliest_future_cooldown() {
            local now_epoch="$1"
            local stage="$2"
            shift 2
            local model provider attempt_key model_cooldown provider_cooldown cooldown_until
            local earliest=0

            for model in "$@"; do
              provider="$(provider_for_model "$model")"
              attempt_key="$stage|$model"

              # Do not wait for a route that this stage cannot try again.
              if [[ -n "${MODEL_ATTEMPTED[$model]:-}" ||
                    -n "${MODEL_STAGE_EXHAUSTED[$attempt_key]:-}" ||
                    -n "${MODEL_BLOCKED[$model]:-}" ||
                    -n "${PROVIDER_BLOCKED[$provider]:-}" ]]; then
                continue
              fi
              if [[ "${MODEL_RUN_CALLS[$model]:-0}" -ge "$MAX_MODEL_CALLS_PER_MODEL" ]]; then
                continue
              fi

              model_cooldown="${MODEL_COOLDOWN_UNTIL[$model]:-0}"
              provider_cooldown="${PROVIDER_COOLDOWN_UNTIL[$provider]:-0}"
              cooldown_until="$model_cooldown"
              if [[ "$provider_cooldown" -gt "$cooldown_until" ]]; then
                cooldown_until="$provider_cooldown"
              fi

              if [[ "$cooldown_until" -gt "$now_epoch" ]] &&
                 { [[ "$earliest" -eq 0 ]] || [[ "$cooldown_until" -lt "$earliest" ]]; }; then
                earliest="$cooldown_until"
              fi
            done

            printf '%s' "$earliest"
          }

          # Regression: an expired first deadline must not hide a later active
          # model/provider cooldown; provider cooldowns override model deadlines.
          (
            MODEL_COOLDOWN_UNTIL["google/expired"]="100"
            MODEL_COOLDOWN_UNTIL["groq/future"]="300"
            PROVIDER_COOLDOWN_UNTIL["groq"]="350"
            actual="$(earliest_future_cooldown 200 implementation "google/expired" "groq/future")"
            if [[ "$actual" != "350" ]]; then
              echo "::error::Cooldown scheduler regression: expected 350, got $actual."
              exit 1
            fi
            MODEL_COOLDOWN_UNTIL["cohere/other"]="310"
            actual="$(earliest_future_cooldown 200 implementation "google/expired" "groq/future" "cohere/other")"
            if [[ "$actual" != "310" ]]; then
              echo "::error::Cooldown scheduler regression: expected earliest active deadline 310, got $actual."
              exit 1
            fi
          ) || exit 1
          echo "Cooldown scheduler regression tests passed: expired deadlines are ignored and active provider/model cooldowns are recomputed."

          if [[ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "google/gemini-4-hydrogen"
              "google/gemini-3.5-flash-lite"
              "google/gemini-3.1-flash-lite"
              "google/gemini-3.8-flash"
              "google/gemma-4-31b-it"
              "google/gemma-4-26b-a4b-it"
            )
          fi
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            MODEL_CHAIN+=("cloudflare-workers-ai/glm-4.7-flash")
          fi
          if [[ -n "${COHERE_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "cohere/north-mini-code"
              "cohere/command-a-plus"
              "cohere/command-a-reasoning"
            )
          fi
          if [[ -n "${GROQ_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "groq/qwen/qwen3.8-27b"
              "groq/openai/gpt-oss-120b"
              "groq/openai/gpt-oss-20b"
            )
          fi
          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
              "openrouter/cohere/north-mini-code:free"
              "openrouter/recursive/flint-v1.0:free"
              "openrouter/thinkingmachines/inkling-2-small:free"
              "openrouter/baidu/ernie-5.5-flash-preview:free"
              "openrouter/nvidia/nemotron-3.5-lightning:free"
              "openrouter/nvidia/nemotron-3.5-super-vl:free"
            )
          fi

          # Copilot Free exposes an Auto model through its CLI adapter.
          if [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]] && command -v copilot >/dev/null 2>&1; then
            MODEL_CHAIN+=("github-copilot/auto")
          fi

          if [[ "${#MODEL_CHAIN[@]}" -eq 0 ]]; then
            echo "::error::No model provider credentials are configured."
            echo "Configure at least one provider: GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, COHERE_API_KEY, both Cloudflare secrets, or COPILOT_GITHUB_TOKEN."
            exit 1
          fi


          # Daily quota accounting uses actual quota scopes, not model count:
          # Google/Groq routes are treated as model-scoped; Cohere, OpenRouter,
          # Cloudflare and Copilot are treated as provider/account-scoped.
          # Provider balance APIs are not queried, so exhaustion is recognized
          # only after the provider returns an explicit quota error.
          quota_pool_for_model() {
            local model="$1"
            local provider
            provider="$(provider_for_model "$model")"
            case "$provider" in
              cohere|openrouter|cloudflare-workers-ai|github-copilot)
                echo "provider:$provider"
                ;;
              *)
                echo "model:$model"
                ;;
            esac
          }

          for model in "${MODEL_CHAIN[@]}"; do
            pool_key="$(quota_pool_for_model "$model")"
            QUOTA_POOL_KEYS["$pool_key"]="1"
          done

          # Load provider-specific reset times for carried quota state. New state
          # stores pool@Unix-epoch entries; older bare pool IDs are migrated
          # conservatively using that provider's reset policy.
          source "$GITHUB_WORKSPACE/.github/scripts/continuation-policy.sh"
          NOW_UTC_EPOCH="$(date -u +%s)"
          load_quota_pool_reset_state "$QUOTA_POOL_RESETS" QUOTA_POOL_KEYS QUOTA_POOL_RESET_AT "$NOW_UTC_EPOCH"
          if [[ -z "$QUOTA_POOL_RESETS" && -n "$EXHAUSTED_QUOTA_POOLS" ]]; then
            echo "::notice::Migrating legacy quota-pool state to provider-aware reset timestamps."
            load_quota_pool_reset_state "$EXHAUSTED_QUOTA_POOLS" QUOTA_POOL_KEYS QUOTA_POOL_RESET_AT "$NOW_UTC_EPOCH"
          fi
          # Preserve explicit monthly quota classes across workflow_dispatch
          # handoffs. Older reset snapshots predate this metadata; infer their
          # two known monthly account scopes from the reset policy.
          declare -A MONTHLY_QUOTA_POOL_KEYS=()
          if [[ -n "${MONTHLY_QUOTA_POOLS:-}" ]]; then
            IFS=',' read -r -a incoming_monthly_pool_keys <<< "$MONTHLY_QUOTA_POOLS"
            for pool_key in "${incoming_monthly_pool_keys[@]}"; do
              [[ -n "${QUOTA_POOL_KEYS[$pool_key]:-}" ]] && MONTHLY_QUOTA_POOL_KEYS["$pool_key"]="1"
            done
          fi
          for pool_key in "${!QUOTA_POOL_RESET_AT[@]}"; do
            case "$pool_key" in
              provider:cohere|provider:github-copilot)
                MONTHLY_QUOTA_POOL_KEYS["$pool_key"]="1"
                ;;
            esac
          done
          refresh_quota_pool_reset_state QUOTA_POOL_RESET_AT "$NOW_UTC_EPOCH"
          PREVIOUSLY_EXHAUSTED_POOL_COUNT="${#QUOTA_POOL_RESET_AT[@]}"
          for pool_key in "${!QUOTA_POOL_RESET_AT[@]}"; do
            echo "::notice::Quota pool $pool_key is held until $(date -u -d "@${QUOTA_POOL_RESET_AT[$pool_key]}" +%Y-%m-%dT%H:%M:%SZ)."
          done

          refresh_quota_counts() {
            local pool_key model provider available now_epoch
            QUOTA_POOL_COOLDOWN_COUNT=0
            now_epoch="$(date -u +%s)"
            refresh_quota_pool_reset_state QUOTA_POOL_RESET_AT "$now_epoch"
            ELIGIBLE_QUOTA_POOL_COUNT=0
            INELIGIBLE_QUOTA_POOL_COUNT=0

            for pool_key in "${!QUOTA_POOL_KEYS[@]}"; do
              if [[ -n "${QUOTA_POOL_RESET_AT[$pool_key]:-}" ]]; then
                QUOTA_POOL_COOLDOWN_COUNT=$((QUOTA_POOL_COOLDOWN_COUNT + 1))
                continue
              fi

              available=false
              for model in "${MODEL_CHAIN[@]}"; do
                [[ "$(quota_pool_for_model "$model")" == "$pool_key" ]] || continue
                provider="$(provider_for_model "$model")"
                if [[ -n "${MODEL_PERMANENTLY_INELIGIBLE[$model]:-}" || -n "${PROVIDER_PERMANENTLY_INELIGIBLE[$provider]:-}" ]]; then
                  continue
                fi
                available=true
                break
              done

              if [[ "$available" == "true" ]]; then
                ELIGIBLE_QUOTA_POOL_COUNT=$((ELIGIBLE_QUOTA_POOL_COUNT + 1))
              else
                INELIGIBLE_QUOTA_POOL_COUNT=$((INELIGIBLE_QUOTA_POOL_COUNT + 1))
              fi
            done

            local denominator=$((QUOTA_POOL_COOLDOWN_COUNT + ELIGIBLE_QUOTA_POOL_COUNT))
            if [[ "$denominator" -gt 0 ]]; then
              QUOTA_EXHAUSTION_PERCENT=$((QUOTA_POOL_COOLDOWN_COUNT * 100 / denominator))
            else
              # No eligible or exhausted pools means there is no measurable
              # quota denominator; report 0%, and never declare the target met.
              QUOTA_EXHAUSTION_PERCENT=0
            fi
            if [[ "$denominator" -gt 0 && "$QUOTA_EXHAUSTION_PERCENT" -ge "$QUOTA_EXHAUSTION_TARGET_PERCENT" ]]; then
              QUOTA_TARGET_REACHED=true
            else
              QUOTA_TARGET_REACHED=false
            fi
          }

          quota_target_reached() {
            refresh_quota_counts
            [[ "$QUOTA_TARGET_REACHED" == "true" ]]
          }

          record_attempt() {
            printf '%s\t%s\t%s\t%s\t%s\t%s\t%s\n' "${ACTIVE_ROUND:-0}" "$1" "$2" "$3" "$4" "$5" "${6:-}" >> "$USAGE_LOG"
          }

          # Cloudflare Workers AI Free uses account-wide daily Neurons
          # allocations. Keep this detector separate so the provider-specific
          # exhausted-pool response is handled before any RPM/TPM retry logic.
          is_cloudflare_daily_neurons_exhausted() {
            grep -Eiq 'used up.{0,100}daily free allocation|daily free allocation|daily.{0,80}allocation.{0,80}neurons|neurons.{0,80}daily.{0,80}(allocation|quota|limit)' "$1"
          }

          # Classify failures before deciding whether to retry, cool down, or
          # disable a route. Daily exhaustion and oversized requests are never
          # mistaken for ordinary transient 429s.
          classify_failure() {
            local provider="$1"
            local log_file="$2"

            if [[ "$provider" == "cloudflare-workers-ai" ]] && is_cloudflare_daily_neurons_exhausted "$log_file"; then
              echo "SHARED_DAILY_QUOTA"
              return 0
            fi

            # Cohere trial keys can hard-stop at a shared monthly API-call cap.
            # Its error message also mentions "higher rate limits" later in the
            # response, which otherwise makes the broad rate-limit matcher
            # misclassify a permanent account cap as a temporary RPM limit.
            if [[ "$provider" == "cohere" ]] && grep -Eiq 'trial key.{0,120}limited to.{0,60}[0-9][0-9,]*[[:space:]]+API calls?[[:space:]]*/[[:space:]]*month' "$log_file"; then
              echo "SHARED_MONTHLY_QUOTA"
              return 0
            fi

            if [[ "$provider" == "github-copilot" ]] && grep -Eiq 'premium requests?.{0,100}(exhausted|limit|allowance)|monthly.{0,80}(AI credits|premium requests?|quota|allowance|limit)' "$log_file"; then
              echo "SHARED_MONTHLY_QUOTA"
              return 0
            fi

            # An explicit per-request TPM ceiling with both Limit and Requested
            # counts is not a transient cooldown: waiting cannot make this exact
            # request fit. Classify it before the generic minute-limit matcher.
            # This covers Groq ITPM, OTPM, and combined TPM responses.
            if grep -Eiq 'request too large for model.{0,500}(tokens per minute|TPM).{0,160}limit[[:space:]]*:?[[:space:]]*[0-9,]+,[[:space:]]*requested[[:space:]]*:?[[:space:]]*[0-9,]+' "$log_file"; then
              echo "REQUEST_TOO_LARGE"
              return 0
            fi

            # Ordinary TPM/RPM throttles without an explicit per-request
            # Limit/Requested mismatch remain retryable after provider cooldown.
            if grep -Eiq 'input tokens per minute|tokens per minute.{0,100}(limit|exceeded)|TPM.{0,80}(limit|exceeded)' "$log_file"; then
              case "$provider" in
                groq|cohere|openrouter|cloudflare-workers-ai)
                  echo "PROVIDER_RATE_LIMIT"
                  ;;
                *)
                  echo "MODEL_RATE_LIMIT"
                  ;;
              esac
              return 0
            fi

            if grep -Eiq 'request too large for model|expected output tokens exceed|reduce max_tokens|prompt.{0,30}(too large|exceeds).{0,30}(limit|maximum)|maximum request size exceeded' "$log_file"; then
              echo "REQUEST_TOO_LARGE"
              return 0
            fi

            # Google Generative Language API reports free-tier daily request
            # exhaustion as RESOURCE_EXHAUSTED plus a metric name and a
            # per-day limit. The wording can place many characters between
            # "quota exceeded" and "per day", so match the metric explicitly
            # before the broad 429/RESOURCE_EXHAUSTED rate-limit detector.
            if [[ "$provider" == "google" ]] && grep -Eiq 'generate_content_free_tier_requests|free_tier_requests.{0,160}(per day|daily)|quota exceeded for metric.{0,200}(per day|daily)' "$log_file"; then
              echo "MODEL_DAILY_QUOTA"
              return 0
            fi

            # OpenRouter identifies its shared free-tier daily cap by this source.
            if [[ "$provider" == "openrouter" ]] && grep -Eiq 'openrouter_free_tier_daily|free.?tier.{0,40}(daily|requests per day)|requests per day' "$log_file"; then
              echo "SHARED_DAILY_QUOTA"
              return 0
            fi

            if grep -Eiq 'requests per month|monthly quota|monthly limit|quota.{0,30}(per month|monthly)|monthly.{0,30}calls|1000 API calls.{0,20}/.{0,5}month|AI credits.{0,30}(exhausted|limit)|premium request.{0,30}(exhausted|limit)' "$log_file"; then
              case "$provider" in
                cohere|github-copilot|openrouter|cloudflare-workers-ai)
                  echo "SHARED_MONTHLY_QUOTA"
                  ;;
                *)
                  echo "MODEL_MONTHLY_QUOTA"
                  ;;
              esac
              return 0
            fi

            if grep -Eiq 'requests per day|tokens per day|per-day limit|daily quota|daily limit|daily free allocation|used up.{0,100}daily.{0,100}allocation|quota.{0,200}(per day|per-day|daily)|RPD|TPD|neurons.{0,30}(exhausted|limit)|workers ai.{0,30}(quota|limit)' "$log_file"; then
              case "$provider" in
                openrouter|cohere|cloudflare-workers-ai|github-copilot)
                  echo "SHARED_DAILY_QUOTA"
                  ;;
                *)
                  echo "MODEL_DAILY_QUOTA"
                  ;;
              esac
              return 0
            fi

            # This generic service-denial wording can originate from an
            # auxiliary OpenCode route (not necessarily the stage provider).
            # Quarantine only the selected model instead of disabling every
            # model under the primary provider.
            if grep -Eiq 'permission denied on the service' "$log_file"; then
              echo "MODEL_UNAVAILABLE"
              return 0
            fi

            if grep -Eiq 'unauthorized|invalid.{0,20}api.?key|API key.{0,20}invalid|invalid_api_key|authentication failed|HTTP 401|HTTP 403|forbidden.{0,20}api|provider.{0,20}not configured' "$log_file"; then
              echo "AUTH_FAILURE"
              return 0
            fi

            if grep -Eiq 'model.{0,20}(not found|unavailable)|no model is available|no longer available|not available to new users|retired model|deprecated model|context length.{0,20}(exceeded|limit)|context window.{0,20}(exceeded|limit)|input too long|maximum context|insufficient credits|not enough credits|payment required' "$log_file"; then
              echo "MODEL_UNAVAILABLE"
              return 0
            fi

            if grep -Eiq 'requests per minute|tokens per minute|input tokens per minute|output tokens per minute|per-minute limit|requests-per-minute|tokens-per-minute|429|RESOURCE_EXHAUSTED|rate.?limit|too many requests|quota exceeded|trial key.{0,80}limited to.{0,40}(minute|second)|retry-after|please retry.{0,40}(in|after)|retry.{0,20}(in|after).{0,20}[0-9]' "$log_file"; then
              if { [[ "$provider" == "cohere" ]] && grep -Eiq 'trial key.{0,80}limited to.{0,40}(minute|second)' "$log_file"; } ||
                 [[ "$provider" == "openrouter" || "$provider" == "cloudflare-workers-ai" || "$provider" == "github-copilot" ]]; then
                echo "PROVIDER_RATE_LIMIT"
              else
                echo "MODEL_RATE_LIMIT"
              fi
              return 0
            fi

            if grep -Eiq 'temporarily unavailable|temporarily overloaded|overloaded|over capacity|service unavailable|HTTP 5[0-9][0-9]|high demand|spikes in demand|try again later|timed out|timeout|connection reset|ECONNRESET|ETIMEDOUT|socket hang up|gateway error|internal error encountered|internal server error|upstream error|server is busy|fetch failed' "$log_file"; then
              echo "TEMP_CAPACITY"
              return 0
            fi

            echo "UNKNOWN"
          }

          # Honor provider-supplied Retry-After / "Please retry in 43.4s" hints.
          # If no hint exists, use exponential backoff with a conservative cap.
          retry_delay_seconds() {
            local log_file="$1"
            local attempt_number="$2"
            local failure_class="$3"
            python3 - "$log_file" "$attempt_number" "$failure_class" <<'PY'
          import datetime
          import email.utils
          import math
          import re
          import sys

          path, attempt_text, failure_class = sys.argv[1:4]
          try:
              text = open(path, "r", encoding="utf-8", errors="replace").read()
          except OSError:
              text = ""

          delay = None
          # Parse units as whole tokens. In particular, "ms" must not be
          # consumed as "m" (minutes), which previously inflated 510.41689ms
          # into a cooldown of roughly 30,631 seconds.
          duration = r"((?:[0-9]+(?:\.[0-9]+)?(?:ms|h|m|s))+\b)"
          matches = list(re.finditer(r"(?:retry|try again)\s+(?:in|after)\s+" + duration, text, re.I))
          if matches:
              raw = re.sub(r"\s+", "", matches[-1].group(1).lower())
              parts = re.findall(r"([0-9]+(?:\.[0-9]+)?)(ms|h|m|s)", raw)
              if parts and "".join(number + unit for number, unit in parts) == raw:
                  delay = sum(
                      float(number) * {"ms": 0.001, "h": 3600, "m": 60, "s": 1}[unit]
                      for number, unit in parts
                  )
          else:
              seconds_matches = list(re.finditer(
                  r"(?:retry|try again)\s+(?:in|after)\s+([0-9]+(?:\.[0-9]+)?)\s+seconds?",
                  text, re.I
              ))
              header_matches = list(re.finditer(r"retry-after\s*:\s*([^\r\n]+)", text, re.I))
              if seconds_matches:
                  delay = float(seconds_matches[-1].group(1))
              elif header_matches:
                  header = header_matches[-1].group(1).strip()
                  if re.fullmatch(r"[0-9]+(?:\.[0-9]+)?", header):
                      delay = float(header)
                  else:
                      try:
                          retry_at = email.utils.parsedate_to_datetime(header)
                          if retry_at.tzinfo is None:
                              retry_at = retry_at.replace(tzinfo=datetime.timezone.utc)
                          delay = max(0, (retry_at - datetime.datetime.now(datetime.timezone.utc)).total_seconds())
                      except (TypeError, ValueError, OverflowError):
                          delay = None

          if delay is None:
              try:
                  attempt = max(1, int(attempt_text))
              except ValueError:
                  attempt = 1
              base = 45 if failure_class == "TEMP_CAPACITY" else 30
              delay = min(base * (2 ** (attempt - 1)), 300)

          print(max(15, math.ceil(delay) + 5))
          PY
          }

          # Return YES, NO, or INVALID from a reviewer transcript. Strip terminal
          # color codes first because some CLI renderers decorate the first line.
          review_decision() {
            local normalized
            if [[ ! -f "$1" ]]; then
              echo "INVALID"
              return 0
            fi

            normalized="$(sed -E $'s/\x1B\\[[0-9;]*[[:alpha:]]//g' "$1")"
            if grep -Eq '^[[:space:]]*REVIEW_FINDINGS:[[:space:]]*YES[[:space:]]*$' <<< "$normalized"; then
              echo "YES"
            elif grep -Eq '^[[:space:]]*REVIEW_FINDINGS:[[:space:]]*NO[[:space:]]*$' <<< "$normalized"; then
              echo "NO"
            else
              echo "INVALID"
            fi
          }

          qa_decision() {
            local normalized
            if [[ ! -f "$1" ]]; then
              echo "INVALID"
              return 0
            fi
            normalized="$(sed -E $'s/\x1B\[[0-9;]*[[:alpha:]]//g' "$1")"
            if grep -Eq '^[[:space:]]*QA_BLOCKER:[[:space:]]*YES[[:space:]]*$' <<< "$normalized"; then
              echo "YES"
            elif grep -Eq '^[[:space:]]*QA_BLOCKER:[[:space:]]*NO[[:space:]]*$' <<< "$normalized"; then
              echo "NO"
            else
              echo "INVALID"
            fi
          }

          # Regression tests: recognize the documented exhausted-allocation
          # wording, but do not misclassify an ordinary per-minute rate limit.
          quota_classifier_test_file="$RUNNER_TEMP/cloudflare-quota-classifier-test.log"
          printf '%s\n' 'Error: You have used up your daily free allocation of 10,000 neurons.' > "$quota_classifier_test_file"
          if ! is_cloudflare_daily_neurons_exhausted "$quota_classifier_test_file"; then
            echo "::error::Cloudflare daily Neurons quota classifier failed its positive regression test."
            exit 1
          fi
          printf '%s\n' 'Error: input tokens per minute limit exceeded.' > "$quota_classifier_test_file"
          if is_cloudflare_daily_neurons_exhausted "$quota_classifier_test_file"; then
            echo "::error::Cloudflare daily Neurons quota classifier incorrectly matched an RPM/TPM error."
            exit 1
          fi
          rm -f "$quota_classifier_test_file"
          echo "Cloudflare daily Neurons quota classifier regression tests passed."

          # Regression coverage for model/provider failure classification.
          classifier_test_file="$RUNNER_TEMP/model-failure-classifier-test.log"
          assert_failure_class() {
            local provider="$1"
            local fixture="$2"
            local expected="$3"
            printf '%s\n' "$fixture" > "$classifier_test_file"
            local actual
            actual="$(classify_failure "$provider" "$classifier_test_file")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Failure classifier mismatch for $provider: expected $expected, got $actual"
              exit 1
            fi
          }
          assert_failure_class "google" 'Quota exceeded for metric generate_content_free_tier_requests; limit 20 per day.' "MODEL_DAILY_QUOTA"
          assert_failure_class "google" 'google.api_core.exceptions.ResourceExhausted: 429 Quota exceeded for metric: generate_content_free_tier_requests; limit: 20 per day.' "MODEL_DAILY_QUOTA"
          assert_failure_class "google" 'Generate content free tier input token count per minute limit exceeded. Please retry in 43.4s.' "MODEL_RATE_LIMIT"
          assert_failure_class "google" 'Generate content free tier requests per minute limit exceeded. Please retry in 43.4s.' "MODEL_RATE_LIMIT"
          assert_failure_class "google" 'Please retry in 43.4s.' "MODEL_RATE_LIMIT"
          assert_failure_class "groq" 'Request too large for model; input tokens per minute (ITPM): Limit 7000, Requested 12283.' "REQUEST_TOO_LARGE"
          assert_failure_class "groq" 'Request too large for model; output tokens per minute (OTPM): Limit 1000, Requested 1242.' "REQUEST_TOO_LARGE"
          assert_failure_class "groq" 'Request too large for model; tokens per minute (TPM): Limit 8000, Requested 9262.' "REQUEST_TOO_LARGE"
          assert_failure_class "groq" 'Request too large for model: maximum context length exceeded.' "REQUEST_TOO_LARGE"
          assert_failure_class "groq" '429 provider tokens per minute limit exceeded. Please retry in 45s.' "PROVIDER_RATE_LIMIT"
          assert_failure_class "cohere" 'Trial key is limited to 20 API calls / minute.' "PROVIDER_RATE_LIMIT"
          assert_failure_class "cohere" 'You are using a Trial key, which is limited to 1000 API calls / month. You can continue to use the Trial key for free or upgrade to a Production key with higher rate limits.' "SHARED_MONTHLY_QUOTA"
          assert_failure_class "github-copilot" 'You have exhausted your monthly premium requests allowance.' "SHARED_MONTHLY_QUOTA"
          assert_failure_class "openrouter" '{"error":{"metadata":{"limit_source":"openrouter_free_tier_daily"}}}' "SHARED_DAILY_QUOTA"
          assert_failure_class "cloudflare-workers-ai" 'You have used up the daily free allocation of 10000 Neurons.' "SHARED_DAILY_QUOTA"
          assert_failure_class "groq" 'Requests per day (RPD) quota exhausted.' "MODEL_DAILY_QUOTA"
          assert_failure_class "openrouter" 'HTTP 429 rate limit exceeded.' "PROVIDER_RATE_LIMIT"
          assert_failure_class "google" 'This model is currently experiencing high demand. Try again later.' "TEMP_CAPACITY"
          assert_failure_class "google" 'Invalid API key: authentication failed.' "AUTH_FAILURE"
          assert_failure_class "groq" 'Error: Permission denied on the service.' "MODEL_UNAVAILABLE"
          rm -f "$classifier_test_file"
          echo "Model failure classifier regression tests passed."

          retry_delay_test_file="$RUNNER_TEMP/model-retry-delay-test.log"
          printf '%s\n' 'Please retry in 43.440153729s.' > "$retry_delay_test_file"
          parsed_retry_delay="$(retry_delay_seconds "$retry_delay_test_file" 1 MODEL_RATE_LIMIT)"
          if [[ "$parsed_retry_delay" -lt 48 || "$parsed_retry_delay" -gt 50 ]]; then
            echo "::error::Retry delay parser failed the seconds-hint regression test: $parsed_retry_delay"
            exit 1
          fi
          # Regression for the millisecond hint that previously parsed
          # 510.41689ms as 510.41689 minutes (about 30,631 seconds).
          printf '%s\n' 'Please retry in 510.41689ms.' > "$retry_delay_test_file"
          parsed_retry_delay="$(retry_delay_seconds "$retry_delay_test_file" 1 MODEL_RATE_LIMIT)"
          if [[ "$parsed_retry_delay" -lt 15 || "$parsed_retry_delay" -gt 16 ]]; then
            echo "::error::Retry delay parser misread a millisecond hint: $parsed_retry_delay"
            exit 1
          fi
          printf '%s\n' 'Please retry in 2m3s.' > "$retry_delay_test_file"
          parsed_retry_delay="$(retry_delay_seconds "$retry_delay_test_file" 1 MODEL_RATE_LIMIT)"
          if [[ "$parsed_retry_delay" -lt 128 || "$parsed_retry_delay" -gt 129 ]]; then
            echo "::error::Retry delay parser failed the compound-duration regression test: $parsed_retry_delay"
            exit 1
          fi
          printf '%s\n' 'Retry-After: 120' > "$retry_delay_test_file"
          parsed_retry_delay="$(retry_delay_seconds "$retry_delay_test_file" 1 MODEL_RATE_LIMIT)"
          if [[ "$parsed_retry_delay" -lt 125 || "$parsed_retry_delay" -gt 126 ]]; then
            echo "::error::Retry-After parser failed the header regression test: $parsed_retry_delay"
            exit 1
          fi
          rm -f "$retry_delay_test_file"
          echo "Retry delay parser regression tests passed."

          review_classifier_test_file="$RUNNER_TEMP/review-classifier-test.log"
          printf '%s\n' 'REVIEW_FINDINGS: YES' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "YES" ]]; then
            echo "::error::Reviewer response classifier failed its YES regression test."
            exit 1
          fi
          printf '%s\n' 'REVIEW_FINDINGS: NO' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "NO" ]]; then
            echo "::error::Reviewer response classifier failed its NO regression test."
            exit 1
          fi
          printf '%s\n' 'Reviewer returned a summary without the required decision.' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "INVALID" ]]; then
            echo "::error::Reviewer response classifier failed its invalid-output regression test."
            exit 1
          fi
          printf '\033[32mREVIEW_FINDINGS: YES\033[0m\n' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "YES" ]]; then
            echo "::error::Reviewer response classifier failed its ANSI-colored-header regression test."
            exit 1
          fi
          rm -f "$review_classifier_test_file"
          echo "Reviewer response classifier regression tests passed."

          # Rotate each role's candidate order after its last successful model.
          # This prevents the same still-healthy route from winning every cycle.
          rotate_array_after() {
            local array_name="$1"
            local after_model="$2"
            local -n array_ref="$array_name"
            local count="${#array_ref[@]}"
            local found=-1
            local i
            for ((i=0; i<count; i++)); do
              if [[ "${array_ref[$i]}" == "$after_model" ]]; then
                found="$i"
                break
              fi
            done
            [[ "$found" -ge 0 && "$count" -gt 1 ]] || return 0

            local -a rotated=()
            local index
            for ((i=1; i<=count; i++)); do
              index=$(((found + i) % count))
              rotated+=("${array_ref[$index]}")
            done
            array_ref=("${rotated[@]}")
          }

          # Keep models from already-used providers later in the list, but
          # round-robin within both preferred and deferred groups.
          prioritize_models() {
            local -n output_ref="$1"
            local role_name="$1"
            shift
            local -a avoid_providers=("$@")
            local -a preferred=()
            local -a deferred=()
            local model provider avoid
            local last_model="${ROLE_LAST_MODEL[$role_name]:-}"

            for model in "${MODEL_CHAIN[@]}"; do
              provider="$(provider_for_model "$model")"
              if [[ "$provider" == "github-copilot" && "${COPILOT_STAGE_ALLOWED:-false}" != "true" ]]; then
                continue
              fi
              avoid="false"
              for blocked_provider in "${avoid_providers[@]}"; do
                if [[ -n "$blocked_provider" && "$provider" == "$blocked_provider" ]]; then
                  avoid="true"
                  break
                fi
              done
              if [[ "$avoid" == "true" ]]; then
                deferred+=("$model")
              else
                preferred+=("$model")
              fi
            done

            if [[ -n "$last_model" ]]; then
              rotate_array_after preferred "$last_model"
              rotate_array_after deferred "$last_model"
            fi
            output_ref=("${preferred[@]}" "${deferred[@]}")
          }

          # Local-only regression fixtures for quota-scope accounting and model rotation.
          test_rotation=(alpha beta gamma)
          rotate_array_after test_rotation beta
          if [[ "${test_rotation[*]}" != "gamma alpha beta" ]]; then
            echo "::error::Model round-robin rotation regression test failed."
            exit 1
          fi

          test_quota_models=(
            "google/gemini-a" "google/gemini-b"
            "groq/model-a" "groq/model-b"
            "cohere/model-a" "cohere/model-b"
            "openrouter/model-a" "openrouter/model-b"
            "cloudflare-workers-ai/model-a"
            "github-copilot/auto"
          )
          declare -A test_quota_pools=()
          for test_model in "${test_quota_models[@]}"; do
            test_pool="$(quota_pool_for_model "$test_model")"
            test_quota_pools["$test_pool"]="1"
          done
          if [[ "${#test_quota_pools[@]}" -ne 8 ]]; then
            echo "::error::Quota-scope grouping regression test failed; expected 8 pools, got ${#test_quota_pools[@]}."
            exit 1
          fi
          (
            MODEL_CHAIN=("google/gemini-a" "google/gemini-b" "cohere/model-a")
            declare -A QUOTA_POOL_KEYS=()
            QUOTA_POOL_KEYS["model:google/gemini-a"]="1"
            QUOTA_POOL_KEYS["model:google/gemini-b"]="1"
            QUOTA_POOL_KEYS["provider:cohere"]="1"
            declare -A QUOTA_POOL_RESET_AT=()
            QUOTA_POOL_RESET_AT["model:google/gemini-a"]="9999999999"
            QUOTA_POOL_RESET_AT["provider:cohere"]="9999999999"
            declare -A MODEL_PERMANENTLY_INELIGIBLE=()
            declare -A PROVIDER_PERMANENTLY_INELIGIBLE=()
            refresh_quota_counts
            if [[ "$QUOTA_POOL_COOLDOWN_COUNT" -ne 2 || "$ELIGIBLE_QUOTA_POOL_COUNT" -ne 1 || "$QUOTA_EXHAUSTION_PERCENT" -ne 66 || "$QUOTA_TARGET_REACHED" != "false" ]]; then
              echo "::error::Quota target regression test failed for 2/3 exhausted pools."
              exit 1
            fi
            QUOTA_POOL_RESET_AT["model:google/gemini-b"]="9999999999"
            refresh_quota_counts
            if [[ "$QUOTA_TARGET_REACHED" != "true" || "$QUOTA_EXHAUSTION_PERCENT" -ne 100 ]]; then
              echo "::error::Quota target regression test failed after all quota pools were exhausted."
              exit 1
            fi
          ) || exit 1
          (
            MODEL_CHAIN=("google/gemini-a" "google/gemini-b")
            declare -A QUOTA_POOL_KEYS=()
            QUOTA_POOL_KEYS["model:google/gemini-a"]="1"
            QUOTA_POOL_KEYS["model:google/gemini-b"]="1"
            declare -A QUOTA_POOL_RESET_AT=()
            QUOTA_POOL_RESET_AT["model:google/gemini-a"]="9999999999"
            declare -A MODEL_PERMANENTLY_INELIGIBLE=()
            MODEL_PERMANENTLY_INELIGIBLE["google/gemini-b"]="model unavailable"
            declare -A PROVIDER_PERMANENTLY_INELIGIBLE=()
            refresh_quota_counts
            if [[ "$QUOTA_POOL_COOLDOWN_COUNT" -ne 1 || "$ELIGIBLE_QUOTA_POOL_COUNT" -ne 0 || "$INELIGIBLE_QUOTA_POOL_COUNT" -ne 1 || "$QUOTA_EXHAUSTION_PERCENT" -ne 100 || "$QUOTA_TARGET_REACHED" != "true" ]]; then
              echo "::error::Quota target regression test failed when every remaining eligible pool was exhausted and one route was ineligible."
              exit 1
            fi
          ) || exit 1
          (
            MODEL_CHAIN=("google/gemini-a")
            declare -A QUOTA_POOL_KEYS=()
            QUOTA_POOL_KEYS["model:google/gemini-a"]="1"
            declare -A QUOTA_POOL_RESET_AT=()
            declare -A MODEL_PERMANENTLY_INELIGIBLE=()
            MODEL_PERMANENTLY_INELIGIBLE["google/gemini-a"]="authentication/configuration failure"
            declare -A PROVIDER_PERMANENTLY_INELIGIBLE=()
            refresh_quota_counts
            if [[ "$QUOTA_POOL_COOLDOWN_COUNT" -ne 0 || "$ELIGIBLE_QUOTA_POOL_COUNT" -ne 0 || "$INELIGIBLE_QUOTA_POOL_COUNT" -ne 1 || "$QUOTA_EXHAUSTION_PERCENT" -ne 0 || "$QUOTA_TARGET_REACHED" != "false" ]]; then
              echo "::error::Quota target regression test failed with zero eligible/exhausted pools; expected 0% and no target."
              exit 1
            fi
          ) || exit 1
          echo "Autonomous router regression tests passed: round-robin, shared/model pool grouping, 100% quota target, ineligible routes, and empty-denominator handling."

          # run_stage <stage> <agent> <prompt> <candidate-model...>
          # Temporary limits cool down the affected model/provider, allow other
          # routes to run, and then automatically revisit the original prompt.
          # Daily/shared quota exhaustion and permanent errors are not retried.
          run_stage() {
            local stage="$1"
            local agent="$2"
            local prompt="$3"
            shift 3
            local -a candidates=("$@")
            local model provider status retry_count delay log_file
            local attempt_key cooldown_until provider_cooldown earliest_cooldown now wait_seconds
            local remaining_stage remaining_total failure_class stage_deadline
            local stage_calls stage_temp_events temp_failure_count pool_key role_name reset_at reset_label
            local stage_run_cap_skips stage_cooldown_skips
            local request_bytes input_budget attachment_bytes
            local -a command_args=()

            STAGE_STATUS["$stage"]="EXHAUSTED"
            STAGE_MODEL["$stage"]=""
            STAGE_PROVIDER["$stage"]=""
            STAGE_LOG["$stage"]=""

            case "$stage" in
              implementation) role_name="IMPLEMENT_MODELS" ;;
              review) role_name="REVIEW_MODELS" ;;
              review-fallback) role_name="REVIEW_FALLBACK_MODELS" ;;
              repair) role_name="REPAIR_MODELS" ;;
              validation-repair) role_name="VALIDATION_REPAIR_MODELS" ;;
              qa) role_name="QA_MODELS" ;;
              qa-fallback) role_name="QA_FALLBACK_MODELS" ;;
              qa-recheck) role_name="QA_RECHECK_MODELS" ;;
              qa-repair) role_name="FINAL_REPAIR_MODELS" ;;
              *) role_name="" ;;
            esac

            stage_deadline=$(( $(date +%s) + STAGE_TEMP_WAIT_BUDGET_SECONDS ))
            stage_calls=0
            stage_temp_events=0
            stage_run_cap_skips=0
            stage_cooldown_skips=0
            if [[ "$stage" == "implementation" ]]; then
              IMPLEMENTATION_RETRYABLE_RUN_LIMIT=false
            fi

            while true; do
              earliest_cooldown=0

              for model in "${candidates[@]}"; do
                provider="$(provider_for_model "$model")"
                attempt_key="$stage|$model"

                if [[ -n "${MODEL_STAGE_OVERSIZE[$attempt_key]:-}" ]]; then
                  continue
                fi

                # Estimate prompt plus actual attached input before invoking a
                # route. Copilot receives file paths except validation-repair,
                # where validation output is embedded into the prompt.
                request_bytes="$(printf '%s' "$prompt" | wc -c)"
                for attachment in "${STAGE_FILES[@]}"; do
                  if [[ -f "$attachment" ]] && { [[ "$provider" != "github-copilot" ]] || [[ "$stage" == "validation-repair" ]]; }; then
                    attachment_bytes="$(wc -c < "$attachment")"
                    request_bytes=$((request_bytes + attachment_bytes))
                  fi
                done
                input_budget="$(model_input_budget_bytes "$model")"
                if [[ "$request_bytes" -gt "$input_budget" ]]; then
                  MODEL_STAGE_OVERSIZE["$attempt_key"]="${request_bytes} bytes exceeds ${input_budget}-byte preflight budget"
                  record_attempt "$stage" "$provider" "$model" 0 "PAYLOAD_SKIPPED" "estimated input ${request_bytes} bytes exceeds conservative ${input_budget}-byte route budget; no request sent"
                  echo "::notice::$model skipped for $stage before dispatch: estimated input ${request_bytes} bytes exceeds its ${input_budget}-byte route budget."
                  continue
                fi

                # A model is used at most once per cycle so implementation,
                # review and QA remain independent. It can be selected again
                # in a later cycle unless its actual quota is exhausted.
                if [[ -n "${MODEL_ATTEMPTED[$model]:-}" ]]; then
                  continue
                fi
                if [[ -n "${MODEL_BLOCKED[$model]:-}" || -n "${PROVIDER_BLOCKED[$provider]:-}" ]]; then
                  continue
                fi
                pool_key="$(quota_pool_for_model "$model")"
                refresh_quota_pool_reset_state QUOTA_POOL_RESET_AT "$(date -u +%s)"
                if [[ -n "${QUOTA_POOL_RESET_AT[$pool_key]:-}" ]]; then
                  stage_cooldown_skips=$((stage_cooldown_skips + 1))
                  continue
                fi
                if [[ -n "${MODEL_STAGE_EXHAUSTED[$attempt_key]:-}" ]]; then
                  continue
                fi
                if [[ "${MODEL_RUN_CALLS[$model]:-0}" -ge "$MAX_MODEL_CALLS_PER_MODEL" ]]; then
                  MODEL_RUN_CAP_REACHED["$model"]="per-model run call budget reached"
                  stage_run_cap_skips=$((stage_run_cap_skips + 1))
                  continue
                fi
                if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
                  AUTONOMOUS_STOP_REASON="total_model_call_budget"
                  break
                fi

                retry_count="${MODEL_STAGE_RETRIES[$attempt_key]:-0}"
                now="$(date +%s)"
                cooldown_until="${MODEL_COOLDOWN_UNTIL[$model]:-0}"
                provider_cooldown="${PROVIDER_COOLDOWN_UNTIL[$provider]:-0}"
                if [[ "$provider_cooldown" -gt "$cooldown_until" ]]; then
                  cooldown_until="$provider_cooldown"
                fi
                if [[ "$cooldown_until" -gt "$now" ]]; then
                  stage_cooldown_skips=$((stage_cooldown_skips + 1))
                  if [[ "$earliest_cooldown" -eq 0 || "$cooldown_until" -lt "$earliest_cooldown" ]]; then
                    earliest_cooldown="$cooldown_until"
                  fi
                  continue
                fi

                if [[ "$stage_calls" -ge "$MAX_STAGE_MODEL_CALLS" ]]; then
                  MODEL_STAGE_EXHAUSTED["$attempt_key"]="per-stage model-call budget reached"
                  continue
                fi

                retry_count=$((retry_count + 1))
                MODEL_STAGE_RETRIES["$attempt_key"]="$retry_count"
                stage_calls=$((stage_calls + 1))
                TOTAL_MODEL_CALLS=$((TOTAL_MODEL_CALLS + 1))
                MODEL_RUN_CALLS["$model"]=$((${MODEL_RUN_CALLS[$model]:-0} + 1))
                RUN_COUNTER=$((RUN_COUNTER + 1))
                log_file="$RUNNER_TEMP/opencode-${stage}-$RUN_COUNTER.log"
                echo "::group::round $ACTIVE_ROUND / ${stage}: $model (attempt $retry_count; run calls ${MODEL_RUN_CALLS[$model]}/$MAX_MODEL_CALLS_PER_MODEL)"
                echo "Total model calls: $TOTAL_MODEL_CALLS/$MAX_TOTAL_MODEL_CALLS"

                command_args=(env -i "PATH=$PATH" "HOME=$HOME" "NO_COLOR=1" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" "RUNNER_TEMP=$RUNNER_TEMP")
                if ! append_provider_credentials command_args "$provider"; then
                  echo "::error::No credentials are available for selected provider $provider."
                  record_attempt "$stage" "$provider" "$model" "$retry_count" "PROVIDER_DISABLED" "required provider credential missing from isolated environment"
                  PROVIDER_BLOCKED["$provider"]="required credential missing"
                  PROVIDER_PERMANENTLY_INELIGIBLE["$provider"]="required credential missing"
                  continue
                fi
                if [[ -n "$COMPACTION_PROVIDER" && "$COMPACTION_PROVIDER" != "$provider" ]]; then
                  if append_provider_credentials command_args "$COMPACTION_PROVIDER"; then
                    echo "Also supplying the configured $COMPACTION_PROVIDER credential for OpenCode compaction model $COMPACTION_MODEL."
                  else
                    echo "::warning::The configured compaction model $COMPACTION_MODEL has no available provider credential in this run."
                  fi
                fi

                if [[ "$provider" == "github-copilot" ]]; then
                  copilot_prompt="$prompt"
                  for attachment in "${STAGE_FILES[@]}"; do
                    if [[ -f "$attachment" ]]; then
                      if [[ "$stage" == "validation-repair" ]]; then
                        copilot_prompt+=$'\n\nBEGIN COMPLETE DETERMINISTIC VALIDATION OUTPUT\n'
                        copilot_prompt+="$(cat "$attachment")"
                        copilot_prompt+=$'\nEND COMPLETE DETERMINISTIC VALIDATION OUTPUT\n'
                      else
                        copilot_prompt+=" Supporting pipeline file to read before acting: $attachment."
                      fi
                    fi
                  done
                  command_args+=(
                    copilot -p "$copilot_prompt" --allow-all-tools
                    --deny-tool='shell(git commit)'
                    --deny-tool='shell(git push)'
                    --deny-tool='shell(gh workflow run)'
                    --deny-tool='shell(gh release create)'
                    --deny-tool='shell(rojo upload)'
                  )
                else
                  command_args+=(
                    opencode run --standalone --auto
                    --model "$model" --agent "$agent"
                    --title "Pocket Habitat $stage run $GITHUB_RUN_NUMBER cycle $ACTIVE_ROUND"
                  )
                  for attachment in "${STAGE_FILES[@]}"; do
                    if [[ -f "$attachment" ]]; then
                      command_args+=(--file "$attachment")
                    fi
                  done
                  command_args+=("$prompt")
                fi

                if "${command_args[@]}" 2>&1 | tee "$log_file"; then
                  status=0
                else
                  status=$?
                fi
                echo "::endgroup::"
                STAGE_LOG["$stage"]="$log_file"
                # Retain the last attempted route even when it fails so recovery
                # notes and the run report identify the provider/model that needs attention.
                STAGE_MODEL["$stage"]="$model"
                STAGE_PROVIDER["$stage"]="$provider"

                if [[ "$status" -eq 0 ]]; then
                  MODEL_ATTEMPTED["$model"]="1"
                  STAGE_STATUS["$stage"]="SUCCESS"
                  STAGE_MODEL["$stage"]="$model"
                  STAGE_PROVIDER["$stage"]="$provider"
                  ROLE_LAST_MODEL["$role_name"]="$model"
                  record_attempt "$stage" "$provider" "$model" "$retry_count" "SUCCESS" "cycle $ACTIVE_ROUND; run calls ${MODEL_RUN_CALLS[$model]}"
                  echo "Stage $stage completed using $model."
                  return 0
                fi

                failure_class="$(classify_failure "$provider" "$log_file")"
                now="$(date +%s)"

                case "$failure_class" in
                  SHARED_DAILY_QUOTA|SHARED_MONTHLY_QUOTA|MODEL_DAILY_QUOTA|MODEL_MONTHLY_QUOTA)
                    pool_key="$(quota_pool_for_model "$model")"
                    reset_at="$(quota_pool_reset_epoch "$pool_key" "$log_file" "$now" "$failure_class")"
                    QUOTA_POOL_RESET_AT["$pool_key"]="$reset_at"
                    if [[ "$failure_class" == *MONTHLY_QUOTA ]]; then
                      MONTHLY_QUOTA_POOL_KEYS["$pool_key"]="1"
                    fi
                    QUOTA_EXHAUSTION_EVENTS=$((QUOTA_EXHAUSTION_EVENTS + 1))
                    reset_label="$(date -u -d "@$reset_at" +%Y-%m-%dT%H:%M:%SZ)"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "QUOTA_COOLDOWN" "$failure_class; pool $pool_key held until $reset_label"
                    echo "::warning::$provider quota pool $pool_key is held until $reset_label ($failure_class)."
                    ;;
                  REQUEST_TOO_LARGE)
                    MODEL_BLOCKED["$model"]="request exceeds model token/rate limit"
                    MODEL_PERMANENTLY_INELIGIBLE["$model"]="request too large for this task"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "MODEL_SKIPPED" "request too large for this model; no pointless retry"
                    echo "::warning::$model cannot accept this request size; excluding it for this run."
                    ;;
                  AUTH_FAILURE)
                    PROVIDER_BLOCKED["$provider"]="authentication or provider configuration failure"
                    PROVIDER_PERMANENTLY_INELIGIBLE["$provider"]="authentication/configuration failure"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "PROVIDER_DISABLED" "authentication/configuration failure"
                    echo "::warning::$provider credentials or permissions were rejected; excluding the provider for this run."
                    ;;
                  MODEL_UNAVAILABLE)
                    MODEL_BLOCKED["$model"]="model unavailable or request unsupported"
                    MODEL_PERMANENTLY_INELIGIBLE["$model"]="model unavailable or request unsupported"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "MODEL_SKIPPED" "model unavailable or request unsupported"
                    echo "::warning::$model is unavailable for this request; excluding it for this run."
                    ;;
                  MODEL_RATE_LIMIT|PROVIDER_RATE_LIMIT|TEMP_CAPACITY|UNKNOWN)
                    stage_temp_events=$((stage_temp_events + 1))
                    TEMP_LIMIT_EVENTS=$((TEMP_LIMIT_EVENTS + 1))
                    temp_failure_count=$((${MODEL_STAGE_TEMP_FAILURES[$attempt_key]:-0} + 1))
                    MODEL_STAGE_TEMP_FAILURES["$attempt_key"]="$temp_failure_count"
                    if [[ "$temp_failure_count" -ge "$MAX_MODEL_TEMP_ATTEMPTS" ]]; then
                      MODEL_STAGE_EXHAUSTED["$attempt_key"]="temporary retry count reached"
                      record_attempt "$stage" "$provider" "$model" "$retry_count" "RETRY_DEFERRED" "$failure_class; per-cycle retry cap reached; route becomes eligible again in a later cycle"
                      echo "::warning::$model remains unavailable after $temp_failure_count $failure_class failures in $stage; deferring it only until the next autonomous cycle."
                    else
                      delay="$(retry_delay_seconds "$log_file" "$temp_failure_count" "$failure_class")"
                      MODEL_COOLDOWN_UNTIL["$model"]=$((now + delay))
                      if [[ "$failure_class" == "PROVIDER_RATE_LIMIT" ]]; then
                        PROVIDER_COOLDOWN_UNTIL["$provider"]=$((now + delay))
                      fi
                      cooldown_until=$((now + delay))
                      if [[ "$earliest_cooldown" -eq 0 || "$cooldown_until" -lt "$earliest_cooldown" ]]; then
                        earliest_cooldown="$cooldown_until"
                      fi
                      record_attempt "$stage" "$provider" "$model" "$retry_count" "COOLDOWN" "$failure_class; retry scheduled in ${delay}s"
                      echo "::notice::$provider/$model is temporarily limited ($failure_class). Cooling down for ${delay}s; other routes will run and later cycles will revisit it."
                    fi
                    ;;
                  *)
                    MODEL_BLOCKED["$model"]="unclassified failure"
                    MODEL_PERMANENTLY_INELIGIBLE["$model"]="unclassified failure"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "MODEL_ERROR" "unclassified exit code $status; quarantining this model and continuing fallback"
                    echo "::warning::Unclassified failure from $model (exit code $status); quarantining this model for this run."
                    ;;
                esac
              done

              if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
                AUTONOMOUS_STOP_REASON="total_model_call_budget"
                break
              fi

              # Recompute after all calls: the previous minimum may have
              # expired while a later provider request was still running.
              # This prevents stale deadlines from skipping a valid retry wait.
              now="$(date +%s)"
              earliest_cooldown="$(earliest_future_cooldown "$now" "$stage" "${candidates[@]}")"

              # Wait only after all currently available alternatives were tried.
              if [[ "$earliest_cooldown" -gt "$now" ]]; then
                remaining_stage=$((stage_deadline - now))
                remaining_total=$((TOTAL_TEMP_WAIT_BUDGET_SECONDS - TOTAL_TEMP_WAIT_SECONDS))
                wait_seconds=$((earliest_cooldown - now))
                if [[ "$wait_seconds" -gt "$remaining_stage" ]]; then
                  wait_seconds="$remaining_stage"
                fi
                if [[ "$wait_seconds" -gt "$remaining_total" ]]; then
                  wait_seconds="$remaining_total"
                fi
                if [[ "$wait_seconds" -gt 0 ]]; then
                  echo "::notice::All currently available alternatives are cooling down. Waiting ${wait_seconds}s, then automatically retrying this stage."
                  record_attempt "$stage" "scheduler" "automatic-cooldown" "$stage_calls" "WAITING" "waiting ${wait_seconds}s for earliest model/provider cooldown"
                  sleep "$wait_seconds"
                  TOTAL_TEMP_WAIT_SECONDS=$((TOTAL_TEMP_WAIT_SECONDS + wait_seconds))
                  continue
                fi
              fi

              break
            done

            if [[ "$stage" == "implementation" ]] && {
              (( stage_run_cap_skips > 0 )) ||
              (( stage_cooldown_skips > 0 )) ||
              (( stage_temp_events > 0 ));
            }; then
              IMPLEMENTATION_RETRYABLE_RUN_LIMIT=true
              echo "::notice::Implementation was blocked by run-local call caps or temporary provider limits; a fresh run may retry those routes."
            fi

            if [[ "$stage_temp_events" -gt 0 ]]; then
              STAGE_STATUS["$stage"]="TEMPORARY_LIMIT_BUDGET_EXHAUSTED"
              echo "::warning::Stage $stage could not complete within its automatic temporary-limit retry budget."
            else
              echo "::warning::No unattempted, available model completed stage $stage."
            fi
            return 1
          }

          # GitHub can transiently reject an otherwise valid Git push (for
          # example, an HTTP 500 from the repository service). Never abandon a
          # validated checkpoint after one such response. Retry the same commit,
          # verify ambiguous pushes by fetching the target ref, and rebase only
          # when another workflow advanced the branch. Never force-push.
          push_checkpoint_with_retry() {
            local remote="${1:-origin}"
            local target_ref="${2:-refs/heads/ai/game-build}"
            local max_attempts="${CHECKPOINT_PUSH_MAX_ATTEMPTS:-5}"
            local delay_seconds="${CHECKPOINT_PUSH_RETRY_DELAY_SECONDS:-5}"
            local push_status=0
            local remote_head=""
            local attempt=1
            local quiet="${CHECKPOINT_PUSH_QUIET:-false}"
            local temp_dir="${RUNNER_TEMP:-${TMPDIR:-/tmp}}"
            local push_log="$temp_dir/pocket-habitat-push-${GITHUB_RUN_ID:-local}-${ACTIVE_ROUND:-0}.log"
            local fetch_log="$temp_dir/pocket-habitat-fetch-${GITHUB_RUN_ID:-local}-${ACTIVE_ROUND:-0}.log"

            if [[ ! "$max_attempts" =~ ^[1-9][0-9]*$ || ! "$delay_seconds" =~ ^[0-9]+$ ]]; then
              echo "::error::Invalid checkpoint push retry configuration."
              return 1
            fi

            while (( attempt <= max_attempts )); do
              if git push "$remote" "HEAD:$target_ref" >"$push_log" 2>&1; then
                if [[ "$quiet" != "true" ]]; then
                  cat "$push_log"
                  echo "Checkpoint push succeeded on attempt $attempt/$max_attempts."
                fi
                return 0
              else
                push_status=$?
              fi

              if [[ "$quiet" != "true" ]]; then
                echo "::warning::Checkpoint push attempt $attempt/$max_attempts failed (git exit $push_status)."
                cat "$push_log"
              fi

              # Authentication/permission/rules failures cannot be repaired by
              # retrying. Non-fast-forward errors are handled by fetch + rebase.
              if grep -Eiq 'authentication failed|permission to .* denied|write access to repository not granted|HTTP 40[13]|GH006|GH013|protected branch|repository rule violations' "$push_log"; then
                echo "::error::Checkpoint push was rejected for a permanent permission or branch-policy reason."
                return 1
              fi

              # A server may accept the update but return an error to the client.
              # Fetching first distinguishes that case from a genuinely lost push.
              if git fetch --no-tags "$remote" "$target_ref" >"$fetch_log" 2>&1; then
                remote_head="$(git rev-parse --verify FETCH_HEAD 2>/dev/null || true)"
                if [[ -n "$remote_head" ]]; then
                  if git merge-base --is-ancestor HEAD "$remote_head"; then
                    if [[ "$quiet" != "true" ]]; then
                      echo "The remote branch already contains this checkpoint; treating the ambiguous push as persisted."
                    fi
                    return 0
                  fi

                  if ! git merge-base "$remote_head" HEAD >/dev/null 2>&1; then
                    echo "::error::The gameplay branch no longer shares history with this checkpoint; refusing to overwrite it."
                    return 1
                  fi

                  if ! git merge-base --is-ancestor "$remote_head" HEAD; then
                    if [[ "$quiet" != "true" ]]; then
                      echo "::notice::The gameplay branch advanced concurrently; rebasing this checkpoint onto the latest remote commit."
                    fi
                    if ! git rebase "$remote_head"; then
                      git rebase --abort >/dev/null 2>&1 || true
                      echo "::error::Could not safely rebase the checkpoint onto the latest gameplay branch. No force-push was attempted."
                      return 1
                    fi
                  fi
                fi
              else
                if [[ "$quiet" != "true" ]]; then
                  echo "::warning::Could not refresh the gameplay branch before retrying the checkpoint push."
                  cat "$fetch_log"
                fi
                if grep -Eiq 'authentication failed|permission to .* denied|write access to repository not granted|HTTP 40[13]' "$fetch_log"; then
                  echo "::error::Unable to read the gameplay branch while reconciling a failed checkpoint push."
                  return 1
                fi
              fi

              if (( attempt < max_attempts )); then
                if [[ "$quiet" != "true" ]]; then
                  echo "::notice::Retrying checkpoint persistence in ${delay_seconds}s (attempt $((attempt + 1))/$max_attempts)."
                fi
                sleep "$delay_seconds"
                if (( delay_seconds < 30 )); then
                  delay_seconds=$((delay_seconds * 2))
                  (( delay_seconds > 60 )) && delay_seconds=60
                else
                  delay_seconds=60
                fi
              fi
              attempt=$((attempt + 1))
            done

            echo "::error::Checkpoint could not be persisted after $max_attempts attempts. The workflow will stop without continuing on uncheckpointed work."
            return 1
          }

          # Reuse the exact same persistence policy in the final safety-net step.
          declare -f push_checkpoint_with_retry > "$RUNNER_TEMP/pocket-habitat-push-checkpoint.sh"

          # Exercise the retry and remote-ref confirmation behavior against a
          # local bare repository. The first push is deliberately rejected with
          # a server-side error; the same commit must persist on the next try.
          checkpoint_push_retry_regression_test() {
            local test_root
            local expected_head
            local actual_head
            test_root="$(mktemp -d "${RUNNER_TEMP:-${TMPDIR:-/tmp}}/pocket-habitat-push-retry.XXXXXX")" || return 1

            git init --bare --initial-branch=main "$test_root/remote.git" >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }
            git init --initial-branch=main "$test_root/seed" >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }
            git -C "$test_root/seed" config user.name "Pocket Habitat Push Test"
            git -C "$test_root/seed" config user.email "push-test@example.invalid"
            printf 'seed\n' > "$test_root/seed/seed.txt"
            git -C "$test_root/seed" add seed.txt
            git -C "$test_root/seed" commit -m "seed test branch" >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }
            git -C "$test_root/seed" remote add origin "$test_root/remote.git"
            git -C "$test_root/seed" push origin HEAD:refs/heads/main >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }
            git clone -q "$test_root/remote.git" "$test_root/clone" || {
              rm -rf "$test_root"
              return 1
            }
            git -C "$test_root/clone" config user.name "Pocket Habitat Push Test"
            git -C "$test_root/clone" config user.email "push-test@example.invalid"
            printf 'checkpoint\n' > "$test_root/clone/checkpoint.txt"
            git -C "$test_root/clone" add checkpoint.txt
            git -C "$test_root/clone" commit -m "validated checkpoint" >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }

            cat > "$test_root/remote.git/hooks/pre-receive" <<EOF
          #!/usr/bin/env bash
          if [[ ! -f "$test_root/rejected-first-push" ]]; then
            touch "$test_root/rejected-first-push"
            echo "remote: Internal Server Error" >&2
            exit 1
          fi
          exit 0
          EOF
            chmod +x "$test_root/remote.git/hooks/pre-receive"

            if ! (
              cd "$test_root/clone"
              RUNNER_TEMP="$test_root" GITHUB_RUN_ID="push-retry-regression" ACTIVE_ROUND=0 CHECKPOINT_PUSH_QUIET=true CHECKPOINT_PUSH_MAX_ATTEMPTS=3 CHECKPOINT_PUSH_RETRY_DELAY_SECONDS=0 push_checkpoint_with_retry origin refs/heads/main
            ); then
              rm -rf "$test_root"
              return 1
            fi

            expected_head="$(git -C "$test_root/clone" rev-parse HEAD)"
            actual_head="$(git --git-dir="$test_root/remote.git" rev-parse refs/heads/main)"
            if [[ "$actual_head" != "$expected_head" ]]; then
              echo "::error::Checkpoint push retry regression did not persist the expected commit."
              rm -rf "$test_root"
              return 1
            fi

            # Simulate the ambiguous-response case: the remote accepts the
            # commit, but the client wrapper reports a server error afterward.
            git clone -q "$test_root/remote.git" "$test_root/ambiguous" || {
              rm -rf "$test_root"
              return 1
            }
            git -C "$test_root/ambiguous" config user.name "Pocket Habitat Push Test"
            git -C "$test_root/ambiguous" config user.email "push-test@example.invalid"
            printf 'ambiguous\n' > "$test_root/ambiguous/ambiguous.txt"
            git -C "$test_root/ambiguous" add ambiguous.txt
            git -C "$test_root/ambiguous" commit -m "accepted but response lost" >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }
            mkdir -p "$test_root/wrapper"
            real_git="$(command -v git)"
            cat > "$test_root/wrapper/git" <<EOF
          #!/usr/bin/env bash
          if [[ "${1:-}" == "push" && ! -f "$test_root/ambiguous-response-sent" ]]; then
            "$real_git" "\$@"
            status=\$?
            if [[ "\$status" -eq 0 ]]; then
              touch "$test_root/ambiguous-response-sent"
              echo "remote: Internal Server Error" >&2
              exit 1
            fi
            exit "\$status"
          fi
          exec "$real_git" "\$@"
          EOF
            chmod +x "$test_root/wrapper/git"

            if ! (
              cd "$test_root/ambiguous"
              PATH="$test_root/wrapper:$PATH" RUNNER_TEMP="$test_root" GITHUB_RUN_ID="push-ambiguous-regression" ACTIVE_ROUND=0 CHECKPOINT_PUSH_QUIET=true CHECKPOINT_PUSH_MAX_ATTEMPTS=3 CHECKPOINT_PUSH_RETRY_DELAY_SECONDS=0 push_checkpoint_with_retry origin refs/heads/main
            ); then
              rm -rf "$test_root"
              return 1
            fi

            expected_head="$(git -C "$test_root/ambiguous" rev-parse HEAD)"
            actual_head="$(git --git-dir="$test_root/remote.git" rev-parse refs/heads/main)"
            if [[ "$actual_head" != "$expected_head" ]]; then
              echo "::error::Ambiguous push regression failed to confirm the already-accepted checkpoint."
              rm -rf "$test_root"
              return 1
            fi

            # Exercise the non-fast-forward path: a second writer advances the
            # remote after this clone has created its own checkpoint.
            git clone -q "$test_root/remote.git" "$test_root/stale" || {
              rm -rf "$test_root"
              return 1
            }
            git clone -q "$test_root/remote.git" "$test_root/concurrent" || {
              rm -rf "$test_root"
              return 1
            }
            for clone_dir in "$test_root/stale" "$test_root/concurrent"; do
              git -C "$clone_dir" config user.name "Pocket Habitat Push Test"
              git -C "$clone_dir" config user.email "push-test@example.invalid"
            done
            printf 'ours\n' > "$test_root/stale/ours.txt"
            git -C "$test_root/stale" add ours.txt
            git -C "$test_root/stale" commit -m "stale checkpoint" >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }
            printf 'concurrent\n' > "$test_root/concurrent/concurrent.txt"
            git -C "$test_root/concurrent" add concurrent.txt
            git -C "$test_root/concurrent" commit -m "concurrent update" >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }
            git -C "$test_root/concurrent" push origin HEAD:refs/heads/main >/dev/null 2>&1 || {
              rm -rf "$test_root"
              return 1
            }

            if ! (
              cd "$test_root/stale"
              RUNNER_TEMP="$test_root" GITHUB_RUN_ID="push-rebase-regression" ACTIVE_ROUND=0 CHECKPOINT_PUSH_QUIET=true CHECKPOINT_PUSH_MAX_ATTEMPTS=3 CHECKPOINT_PUSH_RETRY_DELAY_SECONDS=0 push_checkpoint_with_retry origin refs/heads/main
            ); then
              rm -rf "$test_root"
              return 1
            fi

            expected_head="$(git -C "$test_root/stale" rev-parse HEAD)"
            actual_head="$(git --git-dir="$test_root/remote.git" rev-parse refs/heads/main)"
            if [[ "$actual_head" != "$expected_head" || ! -f "$test_root/stale/concurrent.txt" ]]; then
              echo "::error::Checkpoint push rebase regression failed to preserve both writers' commits."
              rm -rf "$test_root"
              return 1
            fi

            rm -rf "$test_root"
            echo "Checkpoint push retry regression tests passed (transient server rejection and concurrent branch update)."
          }

          if ! checkpoint_push_retry_regression_test; then
            echo "::error::Checkpoint push retry regression test failed."
            exit 1
          fi

          # Persist each reviewed cycle so a GitHub Actions timeout cannot
          # discard several hours of already-validated development work.
          persist_cycle_checkpoint() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [[ -n "$(git status --porcelain -- DevPackages)" ]]; then
              echo "::warning::Restoring unexpected edits under vendored DevPackages before checkpoint."
              git restore --source=HEAD --staged --worktree -- DevPackages
              git clean -fd -- DevPackages
            fi
            git add -A
            if git diff --cached --quiet; then
              echo "Cycle $ACTIVE_ROUND has no repository changes to checkpoint."
              SAFE_TO_PERSIST=true
              echo "safe_to_persist=true" >> "$GITHUB_OUTPUT"
              return 0
            fi
            git commit -m "AI autonomous checkpoint ${GITHUB_RUN_NUMBER} cycle ${ACTIVE_ROUND}" || return 1
            push_checkpoint_with_retry origin refs/heads/ai/game-build || return 1
            PERSISTED_CYCLE_CHECKPOINTS=$((PERSISTED_CYCLE_CHECKPOINTS + 1))
            SAFE_TO_PERSIST=true
            echo "safe_to_persist=true" >> "$GITHUB_OUTPUT"
            echo "Persisted reviewed and validated cycle checkpoint $PERSISTED_CYCLE_CHECKPOINTS."
          }

          persist_recovery_checkpoint() {
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            if [[ -n "$(git status --porcelain -- DevPackages)" ]]; then
              echo "::warning::Restoring unexpected edits under vendored DevPackages before recovery checkpoint."
              git restore --source=HEAD --staged --worktree -- DevPackages
              git clean -fd -- DevPackages
            fi
            git add -A
            if git diff --cached --quiet; then
              echo "No repository changes to save in this recovery checkpoint."
              SAFE_TO_PERSIST=true
              echo "safe_to_persist=true" >> "$GITHUB_OUTPUT"
              return 0
            fi
            git commit -m "AI recovery checkpoint ${GITHUB_RUN_NUMBER} cycle ${ACTIVE_ROUND} (follow-up required)" || return 1
            push_checkpoint_with_retry origin refs/heads/ai/game-build || return 1
            PERSISTED_RECOVERY_CHECKPOINTS=$((PERSISTED_RECOVERY_CHECKPOINTS + 1))
            SAFE_TO_PERSIST=true
            echo "safe_to_persist=true" >> "$GITHUB_OUTPUT"
            echo "::warning::Persisted recovery checkpoint $PERSISTED_RECOVERY_CHECKPOINTS. Validation/QA follow-up remains; this is not a validated release checkpoint."
          }

          write_recovery_context() {
            local reason="$1"
            shift

            # Keep only the current actionable recovery state in the prompt
            # file. Full transcripts and diffs are preserved as Actions
            # artifacts; appending them here previously caused exponential
            # context growth and made fallback models unusable.
            {
              echo "# Pocket Habitat — Active Recovery Summary"
              echo
              echo "RECOVERY_STATUS: OPEN"
              echo
              echo "- Last updated by workflow run: ${GITHUB_RUN_NUMBER}"
              echo "- Cycle: ${ACTIVE_ROUND}"
              echo
              echo "## Current required action"
              echo
              echo "$reason"
              echo
              echo "## Evidence"
              echo
              echo "Full review logs, validation output, model transcripts, and diffs are retained in the workflow artifact for run ${GITHUB_RUN_NUMBER}; do not paste them into this active note."
              for report in "$@"; do
                if [[ -f "$report" ]]; then
                  printf '%s (%s bytes)\n' "- $(basename "$report")" "$(wc -c < "$report")"
                fi
              done
              echo
              echo "Do not start unrelated feature work until the active source-level issue is fixed and independently checked. Never weaken checks or claim unrun tests passed."
              echo
              echo "Archive: docs/recovery-archive/AUTONOMOUS_RECOVERY_2026-11-15_PRE_COMPACTION.md"
            } > "$RECOVERY_CONTEXT_FILE"
            RECOVERY_CONTEXT_ACTIVE=true
            local recovery_bytes
            recovery_bytes="$(wc -c < "$RECOVERY_CONTEXT_FILE")"
            if (( recovery_bytes > 12000 )); then
              echo "::error::Active recovery note exceeded the 12 KB prompt budget (${recovery_bytes} bytes)."
              return 1
            fi
          }
          refresh_diff() {
            # Intent-to-add makes new project files visible to git diff without
            # staging their content. Third-party DevPackages are excluded.
            git add -N -- . 2>/dev/null || true
            git diff --no-ext-diff --binary HEAD -- . ':(exclude)DevPackages/**' > "$DIFF_FILE"
          }

          run_validation() {
            local result=0
            : > "$VALIDATION_LOG"

            if rojo build default.project.json -o build/pocket-habitat.rbxl >> "$VALIDATION_LOG" 2>&1; then
              echo "PASS: Rojo build -> build/pocket-habitat.rbxl" >> "$VALIDATION_LOG"
            else
              echo "FAIL: Rojo build" >> "$VALIDATION_LOG"
              result=1
            fi

            if stylua --check src >> "$VALIDATION_LOG" 2>&1; then
              echo "PASS: StyLua check src" >> "$VALIDATION_LOG"
            else
              echo "FAIL: StyLua check src" >> "$VALIDATION_LOG"
              result=1
            fi

            if selene src >> "$VALIDATION_LOG" 2>&1; then
              echo "PASS: Selene src" >> "$VALIDATION_LOG"
            else
              echo "FAIL: Selene src" >> "$VALIDATION_LOG"
              result=1
            fi

            VALIDATION_STATUS="$result"
            cat "$VALIDATION_LOG"
            return "$result"
          }

          repair_validation_until_pass() {
            local repair_round=0
            local repair_result before_repair_hash after_repair_hash
            run_validation
            while [[ "$VALIDATION_STATUS" -ne 0 && "$repair_round" -lt "$MAX_VALIDATION_REPAIR_ROUNDS_PER_CYCLE" && "$TOTAL_MODEL_CALLS" -lt "$MAX_TOTAL_MODEL_CALLS" ]]; do
              repair_round=$((repair_round + 1))
              echo "::warning::Validation still fails. Starting repair attempt $repair_round/$MAX_VALIDATION_REPAIR_ROUNDS_PER_CYCLE with the next eligible model."
              VALIDATION_REPAIR_PROMPT="The attached deterministic validation report contains real failures. This is a required repair task, not a reason to stop. Fix actual root causes in project-owned files, including every reported StyLua/Selene/Rojo failure. Do not suppress warnings, weaken lint rules, skip checks, alter the toolchain to hide failures, or claim success without rerunning all checks. Preserve unrelated correct changes. Do not modify DevPackages, publish, commit, or push. Report exact files changed and test results."
              COPILOT_STAGE_ALLOWED=true
              prioritize_models VALIDATION_REPAIR_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER"
              STAGE_FILES=("$VALIDATION_LOG")
              if [[ "$RECOVERY_CONTEXT_ACTIVE" == "true" && -f "$RECOVERY_CONTEXT_FILE" ]]; then
                STAGE_FILES+=("$RECOVERY_CONTEXT_FILE")
              fi
              refresh_diff
              before_repair_hash="$(sha256sum "$DIFF_FILE" | awk '{print $1}')"
              run_stage "validation-repair" "build" "$VALIDATION_REPAIR_PROMPT" "${VALIDATION_REPAIR_MODELS[@]}"
              repair_result=$?
              if [[ "$repair_result" -ne 0 ]]; then
                echo "::warning::No additional validation-repair model completed; carrying the failure report forward."
                break
              fi
              run_validation
              refresh_diff
              after_repair_hash="$(sha256sum "$DIFF_FILE" | awk '{print $1}')"
              if [[ "$before_repair_hash" != "$after_repair_hash" ]]; then
                NO_PROGRESS_ROUNDS=0
              fi
            done
            [[ "$VALIDATION_STATUS" -eq 0 ]]
          }

          IMPLEMENT_PROMPT="You are the Pocket Habitat implementation agent. Read AGENTS.md and the relevant project documentation before changing code. Complete the user's task below with working, integrated Luau gameplay rather than disconnected scaffolding. Inspect the current repository state first and preserve correct existing work. Keep gameplay server-authoritative; validate all remote requests, ownership, distance, rewards, inventory, purchases, quests, and persistence. Do not publish to Roblox, access publishing credentials, create/switch branches, commit, or push. Never modify or reformat DevPackages or other vendored dependencies. Format/lint only src/. Run the checks you can actually run and report exact results; never claim Roblox Studio, engine, multiplayer, or TestEZ execution unless it truly happened. Update docs/PROJECT_STATE.md, docs/ROADMAP.md, and docs/TESTING.md accurately. User task for the first cycle: ${TASK}"

          CONTINUATION_PROMPT="You are continuing Pocket Habitat autonomous development in a multi-cycle run. The user's original request was: ${TASK}. The first implementation pass and its review/QA have already happened. Do NOT repeat completed changes or restart the project. Read AGENTS.md, docs/PROJECT_STATE.md, docs/ROADMAP.md, and docs/TESTING.md. Inspect only the architecture sections relevant to the selected task using headings and narrow line ranges; do not load the entire docs/TECHNICAL_ARCHITECTURE.md. Inspect the current source and working tree, and identify the highest-priority unfinished task. Continue the original request if it remains incomplete; otherwise advance to the next highest-value incomplete roadmap task. Fix verified blockers before adding features. Implement one meaningful, integrated vertical slice, run checks, and accurately update the living docs so the following cycle can continue. Do not stop merely because the original request is complete; continue to the next documented task. Do not invent work or make unrelated changes. Never publish, commit, push, modify secrets/provider configuration, or touch DevPackages."

          REVIEW_PROMPT="You are an independent, read-only reviewer for Pocket Habitat. Review the current cycle's implementation diff against the repository's actual code and architecture. Do not edit files, run shell commands, or ask another agent to make changes. Verify every suspected issue against the source before reporting it. Trace startup initialization, required modules, every changed module API and its call sites, remote/event ownership, player-data loss or cross-player leakage, economy/inventory duplication, broken gameplay interactions, persistence failure handling, runtime errors, and regressions. Explicitly verify that every called module function exists in its required module and that new lifecycle wiring is reachable. Ignore style-only opinions unless they cause a real problem. Start with exactly one line: REVIEW_FINDINGS: YES or REVIEW_FINDINGS: NO. Use YES only if at least one actionable defect is confirmed in source. Return a concise Markdown report with severity (CRITICAL/HIGH/MEDIUM/LOW), file and line, evidence, impact, and a specific suggested correction. If no actionable findings exist, use REVIEW_FINDINGS: NO and explain any remaining runtime checks. Do not claim a test was run unless the attached evidence shows it."

          echo "Configured models: ${#MODEL_CHAIN[@]}"
          echo "Quota pools tracked: ${#QUOTA_POOL_KEYS[@]} (100% eligible-pool exhaustion target)"
          echo "Autonomous policy: recover from source/validation/QA errors across cycles; only hard safety, trust, persistence, or global-budget limits may stop the run."
          echo "Per-model call cap: $MAX_MODEL_CALLS_PER_MODEL; total call cap: $MAX_TOTAL_MODEL_CALLS; round cap: $MAX_AUTONOMOUS_ROUNDS"

          COPILOT_STAGE_ALLOWED=true
          prioritize_models IMPLEMENT_MODELS
          IMPLEMENT_PROVIDER=""
          REVIEW_PROVIDER=""
          REPAIR_PROVIDER=""

          for ((round=1; round<=MAX_AUTONOMOUS_ROUNDS; round++)); do
            ACTIVE_ROUND="$round"
            SAFE_TO_PERSIST=false
            echo "safe_to_persist=false" >> "$GITHUB_OUTPUT"
            refresh_quota_counts

            if [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
              if [[ "$RECOVERY_CONTEXT_ACTIVE" == "true" ]]; then
                AUTONOMOUS_STOP_REASON="daily_quota_target_reached_with_recovery_debt"
                PIPELINE_EXIT=1
                echo "::error::All eligible quota pools are exhausted, but unresolved recovery work remains in the latest recovery checkpoint."
              else
                AUTONOMOUS_STOP_REASON="daily_quota_target_reached"
                echo "::notice::Quota reset target reached: ${QUOTA_POOL_COOLDOWN_COUNT}/$((QUOTA_POOL_COOLDOWN_COUNT + ELIGIBLE_QUOTA_POOL_COUNT)) eligible quota pools."
              fi
              break
            fi
            if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
              AUTONOMOUS_STOP_REASON="total_model_call_budget"
              break
            fi

            # Reset per-cycle route/stage exclusions so temporary-limited models
            # can be revisited after cooldown in later cycles. Daily quota blocks,
            # permanent ineligibility, cooldown timestamps, and run-wide budgets
            # remain intact. MAX_MODEL_TEMP_ATTEMPTS is therefore per stage/cycle.
            unset MODEL_ATTEMPTED MODEL_STAGE_EXHAUSTED MODEL_STAGE_TEMP_FAILURES
            declare -A MODEL_ATTEMPTED=()
            declare -A MODEL_STAGE_EXHAUSTED=()
            declare -A MODEL_STAGE_TEMP_FAILURES=()
            IMPLEMENT_PROVIDER=""
            REVIEW_PROVIDER=""
            REPAIR_PROVIDER=""
            STAGE_FILES=()

            echo "::group::Autonomous development cycle $round"
            echo "Cycle $round begins. Quota pools held until reset: $QUOTA_POOL_COOLDOWN_COUNT; eligible pools: $ELIGIBLE_QUOTA_POOL_COUNT."
            refresh_diff
            before_diff_hash="$(sha256sum "$DIFF_FILE" | awk '{print $1}')"

            if [[ "$round" -eq 1 && "$RECOVERY_CONTEXT_ACTIVE" != "true" && "$IS_CONTINUATION_RUN" != "true" ]]; then
              CURRENT_IMPLEMENT_PROMPT="$IMPLEMENT_PROMPT"
            else
              # A child workflow run starts its own round counter at 1, but it
              # is still a continuation of the original task. Re-inspect the
              # current project state instead of replaying the first-pass prompt.
              CURRENT_IMPLEMENT_PROMPT="$CONTINUATION_PROMPT"
              if [[ "$RECOVERY_CONTEXT_ACTIVE" == "true" && -f "$RECOVERY_CONTEXT_FILE" ]]; then
                CURRENT_IMPLEMENT_PROMPT+=$'\n\nPRIORITY RECOVERY INSTRUCTION: Read the attached recovery report first. Fix every automation-resolvable open item before unrelated feature work. Do not repeat a patch that failed validation and do not weaken any check. When every listed source-level item is genuinely fixed and independently verified, update docs/AUTONOMOUS_RECOVERY.md to RECOVERY_STATUS: RESOLVED and append concrete evidence. Leave the status OPEN if any source-level item remains unresolved. Keep Roblox Studio/multiplayer/DataStore runtime gaps explicitly marked unverified when the current runner cannot execute them; never claim they passed.'
                STAGE_FILES+=("$RECOVERY_CONTEXT_FILE")
              fi
            fi

            COPILOT_STAGE_ALLOWED=true
            prioritize_models IMPLEMENT_MODELS
            run_stage "implementation" "build" "$CURRENT_IMPLEMENT_PROMPT" "${IMPLEMENT_MODELS[@]}"
            IMPLEMENT_RESULT=$?
            IMPLEMENT_PROVIDER="${STAGE_PROVIDER[implementation]:-}"

            if [[ "$IMPLEMENT_RESULT" -ne 0 ]]; then
              echo "::warning::No implementation route completed this attempt. Retaining the current recovery task and retrying eligible routes in a later cycle."
              if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
                refresh_diff
                write_recovery_context "The global model-call budget was reached during implementation. The current source diff may be incomplete and remains unreviewed. Obtain independent review and QA before treating it as validated or starting unrelated work." "$DIFF_FILE"
                if ! persist_recovery_checkpoint; then
                  AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                else
                  AUTONOMOUS_STOP_REASON="total_model_call_budget"
                fi
                PIPELINE_EXIT=1
                echo "::endgroup::"
                break
              fi
              if [[ "$RECOVERY_CONTEXT_ACTIVE" != "true" ]]; then
                write_recovery_context "No configured implementation route completed cycle $round. Revisit temporarily limited routes after cooldown, try every still-eligible model, and inspect the route-attempt log. Do not abandon the original task."
              fi
            fi

            refresh_diff
            after_diff_hash="$(sha256sum "$DIFF_FILE" | awk '{print $1}')"
            if [[ "$before_diff_hash" == "$after_diff_hash" ]]; then
              NO_PROGRESS_ROUNDS=$((NO_PROGRESS_ROUNDS + 1))
              echo "::warning::Implementation cycle $round produced no repository diff ($NO_PROGRESS_ROUNDS consecutive no-progress cycles)."
              if [[ "$IMPLEMENT_RESULT" -ne 0 ]]; then
                if ! persist_recovery_checkpoint; then
                  PIPELINE_EXIT=1
                  AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                  echo "::error::Unable to persist the retry/recovery instruction for the next cycle."
                  echo "::endgroup::"
                  break
                fi
                if [[ "$NO_PROGRESS_ROUNDS" -ge "$MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS" ]]; then
                  PIPELINE_EXIT=1
                  AUTONOMOUS_STOP_REASON="no_implementation_progress"
                  echo "::error::No implementation route produced safe changes in $NO_PROGRESS_ROUNDS consecutive cycles. Stopping under the no-capable-agent safety exception."
                  echo "::endgroup::"
                  break
                fi
                echo "::endgroup::"
                continue
              fi
            else
              NO_PROGRESS_ROUNDS=0
            fi

            # Independent review uses a different provider first. Every changed
            # cycle is reviewed before validation and QA.
            COPILOT_STAGE_ALLOWED=false
            prioritize_models REVIEW_MODELS "$IMPLEMENT_PROVIDER"
            STAGE_FILES=("$DIFF_FILE")
            run_stage "review" "reviewer" "$REVIEW_PROMPT" "${REVIEW_MODELS[@]}"
            REVIEW_RESULT=$?
            REVIEW_PROVIDER="${STAGE_PROVIDER[review]:-}"
            REVIEW_LOG_PATH="${STAGE_LOG[review]:-}"
            REVIEW_DECISION="INVALID"

            if [[ "$REVIEW_RESULT" -eq 0 && -f "$REVIEW_LOG_PATH" ]]; then
              REVIEW_DECISION="$(review_decision "$REVIEW_LOG_PATH")"
            fi

            if [[ "$REVIEW_RESULT" -ne 0 || "$REVIEW_DECISION" == "INVALID" ]]; then
              echo "::warning::Independent review did not produce a valid decision. Trying the remaining independent review routes."
              REVIEW_FALLBACK_PROMPT="You are an independent, read-only reviewer for Pocket Habitat. Inspect the attached current diff and relevant source. Verify findings against source, especially startup initialization and module API call sites. Do not edit files or run shell commands. Your FIRST output line MUST be exactly REVIEW_FINDINGS: YES or REVIEW_FINDINGS: NO. Use YES only for confirmed actionable defects. Report severity, file/line, evidence, impact, and correction. Never claim tests ran unless evidence proves it."
              prioritize_models REVIEW_FALLBACK_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER"
              STAGE_FILES=("$DIFF_FILE")
              run_stage "review-fallback" "reviewer" "$REVIEW_FALLBACK_PROMPT" "${REVIEW_FALLBACK_MODELS[@]}"
              REVIEW_FALLBACK_RESULT=$?
              if [[ "$REVIEW_FALLBACK_RESULT" -eq 0 ]]; then
                REVIEW_LOG_PATH="${STAGE_LOG[review-fallback]:-}"
                REVIEW_DECISION="$(review_decision "$REVIEW_LOG_PATH")"
                if [[ "$REVIEW_DECISION" != "INVALID" ]]; then
                  REVIEW_RESULT=0
                  REVIEW_PROVIDER="${STAGE_PROVIDER[review-fallback]:-}"
                fi
              fi
            fi

            if [[ "$REVIEW_RESULT" -ne 0 || "$REVIEW_DECISION" == "INVALID" ]]; then
              write_recovery_context "No trustworthy independent review decision was available in cycle $round after trying the review and fallback routes. The current diff is preserved below but is NOT approved. Obtain a valid independent review of the complete accumulated diff before normal validated checkpointing or unrelated feature work." "$REVIEW_LOG_PATH" "$DIFF_FILE"
              if ! persist_recovery_checkpoint; then
                PIPELINE_EXIT=1
                AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                echo "::error::Unable to preserve the unreviewed recovery task."
                echo "::endgroup::"
                break
              fi
              AUTONOMOUS_RECOVERY_CYCLES=$((AUTONOMOUS_RECOVERY_CYCLES + 1))
              echo "::warning::Review unavailable/invalid. Preserved an explicitly unreviewed recovery checkpoint and will retry in the next cycle."
              echo "::endgroup::"
              refresh_quota_counts
              if [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
                AUTONOMOUS_STOP_REASON="daily_quota_target_reached_with_recovery_debt"
                PIPELINE_EXIT=1
                break
              fi
              if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
                AUTONOMOUS_STOP_REASON="total_model_call_budget"
                PIPELINE_EXIT=1
                break
              fi
              if [[ "$NO_PROGRESS_ROUNDS" -ge "$MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS" ]]; then
                AUTONOMOUS_STOP_REASON="no_implementation_progress"
                PIPELINE_EXIT=1
                break
              fi
              continue
            fi

            if [[ "$REVIEW_DECISION" == "YES" ]]; then
              COPILOT_STAGE_ALLOWED=true
              REPAIR_PROMPT="You are the Pocket Habitat repair engineer. Read the attached independent review output and verify each finding in the current source before changing anything. Fix confirmed CRITICAL and HIGH findings, plus MEDIUM findings that directly break the requested task or core progression. Do not blindly apply speculative comments. Preserve working behavior, keep all server-side validation and data safety, never modify DevPackages, do not publish, and do not commit or push. Run appropriate local checks and accurately update project-state/testing docs. The attached text is the selected independent review report."
              prioritize_models REPAIR_MODELS "$REVIEW_PROVIDER"
              STAGE_FILES=("$REVIEW_LOG_PATH")
              run_stage "repair" "build" "$REPAIR_PROMPT" "${REPAIR_MODELS[@]}"
              REPAIR_RESULT=$?
              REPAIR_PROVIDER="${STAGE_PROVIDER[repair]:-}"
              if [[ "$REPAIR_RESULT" -ne 0 ]]; then
                write_recovery_context "The independent reviewer found actionable defects, but no repair model completed a fix in this cycle. Resolve the attached findings before unrelated feature work." "$REVIEW_LOG_PATH"
                if ! persist_recovery_checkpoint; then
                  PIPELINE_EXIT=1
                  AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                  echo "::error::Unable to preserve the reviewed recovery task."
                  echo "::endgroup::"
                  break
                fi
                AUTONOMOUS_RECOVERY_CYCLES=$((AUTONOMOUS_RECOVERY_CYCLES + 1))
                echo "::warning::Repair route unavailable. Preserving review findings and continuing with a recovery cycle."
                echo "::endgroup::"
                if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
                  AUTONOMOUS_STOP_REASON="total_model_call_budget"
                  PIPELINE_EXIT=1
                  break
                fi
                continue
              fi
            else
              STAGE_STATUS["repair"]="SKIPPED (no confirmed findings)"
            fi

            repair_validation_until_pass
            VALIDATION_REPAIR_RESULT=$?
            if [[ "$VALIDATION_STATUS" -ne 0 ]]; then
              VALIDATION_RECOVERY_CYCLES=$((VALIDATION_RECOVERY_CYCLES + 1))
              echo "::warning::Validation remains failing after in-cycle repair attempts. QA will inspect the actual diff and diagnostic log; the next cycle will prioritize the unresolved failure."
            fi
            if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
              write_recovery_context "The global model-call budget was reached after deterministic validation. Independent review completed, but QA did not run because no model calls remained. Resolve the attached validation findings and obtain independent QA in the next run." "$REVIEW_LOG_PATH" "$DIFF_FILE" "$VALIDATION_LOG"
              if ! persist_recovery_checkpoint; then
                AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
              else
                AUTONOMOUS_STOP_REASON="total_model_call_budget"
              fi
              PIPELINE_EXIT=1
              echo "::warning::Global model-call budget reached during validation recovery; saved reviewed but QA-pending recovery work."
              echo "::endgroup::"
              break
            fi
            refresh_diff
            COPILOT_STAGE_ALLOWED=false
            prioritize_models QA_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER" "$REPAIR_PROVIDER"
            STAGE_FILES=("$DIFF_FILE" "$VALIDATION_LOG")
            QA_PROMPT="You are the read-only Pocket Habitat QA agent. Independently inspect the entire current cycle diff and deterministic validation log, then inspect all relevant source and call sites. Do not trust reviewer summaries without verifying them. If the attached diff is empty, including a zero-byte diff, treat this as a baseline QA review rather than an invalid task: inspect the current source and project documentation directly, and assess the existing checkpoint for concrete correctness risks. Do not reject, skip, or return an invalid response solely because there are no changed lines. Trace server startup from the first line through module initialization and player event connections; verify every invoked module function exists. Inspect geometry/transforms, player spawn/respawn, saved-state restoration, exact plot/resource ownership and distance checks, persistence failure handling, and multiplayer boundaries. Start with exactly one line: QA_BLOCKER: YES or QA_BLOCKER: NO. Say YES for a concrete critical/high correctness, security, progression, or player-data issue. Report what CI actually passed and all missing tests. A deterministic validation failure is diagnostic evidence, not a reason to abandon QA or claim success. Do not edit files, run shell commands, or claim unexecuted TestEZ, Roblox engine, multiplayer, or manual playtests passed."
            run_stage "qa" "qa" "$QA_PROMPT" "${QA_MODELS[@]}"
            QA_RESULT=$?
            QA_LOG="${STAGE_LOG[qa]:-}"
            QA_PRIMARY_LOG="$QA_LOG"
            QA_FALLBACK_LOG=""
            QA_DECISION="INVALID"
            if [[ "$QA_RESULT" -eq 0 && -f "$QA_LOG" ]]; then
              QA_DECISION="$(qa_decision "$QA_LOG")"
            fi
            if [[ "$QA_RESULT" -eq 0 ]]; then
              if [[ "$QA_DECISION" == "INVALID" ]]; then
                STAGE_STATUS["qa"]="SUCCESS (invalid/missing QA_BLOCKER marker)"
              else
                STAGE_STATUS["qa"]="SUCCESS (QA_BLOCKER: $QA_DECISION)"
              fi
            fi
            if [[ "$QA_RESULT" -ne 0 || "$QA_DECISION" == "INVALID" ]]; then
              echo "::warning::QA failed or returned an invalid decision. Trying the remaining independent QA routes."
              QA_FALLBACK_PROMPT="Independently inspect the attached current diff and validation log. If the diff is empty or zero bytes, inspect the current source and project documentation as a baseline QA review; do not treat an empty diff as invalid or skip the decision. Do not edit files or run commands. Your FIRST output line MUST be exactly QA_BLOCKER: YES or QA_BLOCKER: NO. YES requires a concrete critical/high correctness, security, progression, or player-data issue. Report evidence and missing runtime tests; never claim unrun tests passed."
              prioritize_models QA_FALLBACK_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER" "${STAGE_PROVIDER[qa]:-}"
              STAGE_FILES=("$DIFF_FILE" "$VALIDATION_LOG")
              run_stage "qa-fallback" "qa" "$QA_FALLBACK_PROMPT" "${QA_FALLBACK_MODELS[@]}"
              QA_RESULT=$?
              QA_FALLBACK_LOG="${STAGE_LOG[qa-fallback]:-}"
              if [[ "$QA_RESULT" -eq 0 ]]; then
                QA_LOG="$QA_FALLBACK_LOG"
                QA_DECISION="$(qa_decision "$QA_LOG")"
                if [[ "$QA_DECISION" == "INVALID" ]]; then
                  STAGE_STATUS["qa-fallback"]="SUCCESS (invalid/missing QA_BLOCKER marker)"
                else
                  STAGE_STATUS["qa-fallback"]="SUCCESS (QA_BLOCKER: $QA_DECISION)"
                fi
              fi
            fi
            if [[ "$QA_RESULT" -ne 0 || "$QA_DECISION" == "INVALID" ]]; then
              write_recovery_context "No trustworthy QA decision was available in cycle $round. Primary QA route: ${STAGE_PROVIDER[qa]:-unknown}/${STAGE_MODEL[qa]:-unknown} / ${STAGE_STATUS[qa]:-unknown}. Fallback QA route: ${STAGE_PROVIDER[qa-fallback]:-unknown}/${STAGE_MODEL[qa-fallback]:-unknown} / ${STAGE_STATUS[qa-fallback]:-not attempted}. The implementation diff contains $(wc -c < "$DIFF_FILE") bytes. Both QA transcripts are retained below and in the workflow artifact. The diff has passed independent code review but remains QA-unverified. Obtain valid independent QA and resolve any blockers before normal validated checkpointing or unrelated feature work." "$REVIEW_LOG_PATH" "$QA_PRIMARY_LOG" "$QA_FALLBACK_LOG" "$DIFF_FILE" "$VALIDATION_LOG"
              if ! persist_recovery_checkpoint; then
                PIPELINE_EXIT=1
                AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                echo "::error::Unable to preserve the QA-recovery task."
                echo "::endgroup::"
                break
              fi
              AUTONOMOUS_RECOVERY_CYCLES=$((AUTONOMOUS_RECOVERY_CYCLES + 1))
              echo "::warning::QA unavailable/invalid. Preserved a reviewed but QA-unverified recovery checkpoint and will retry in the next cycle."
              echo "::endgroup::"
              refresh_quota_counts
              if [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
                AUTONOMOUS_STOP_REASON="daily_quota_target_reached_with_recovery_debt"
                PIPELINE_EXIT=1
                break
              fi
              if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
                AUTONOMOUS_STOP_REASON="total_model_call_budget"
                PIPELINE_EXIT=1
                break
              fi
              if [[ "$NO_PROGRESS_ROUNDS" -ge "$MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS" ]]; then
                AUTONOMOUS_STOP_REASON="no_implementation_progress"
                PIPELINE_EXIT=1
                break
              fi
              continue
            fi

            QA_REPAIR_ROUNDS=0
            while [[ "$QA_DECISION" == "YES" && "$QA_REPAIR_ROUNDS" -lt "$MAX_QA_REPAIR_ROUNDS_PER_CYCLE" ]]; do
              QA_REPAIR_ROUNDS=$((QA_REPAIR_ROUNDS + 1))
              echo "::warning::QA blocker repair attempt $QA_REPAIR_ROUNDS/$MAX_QA_REPAIR_ROUNDS_PER_CYCLE."
              COPILOT_STAGE_ALLOWED=true
              FINAL_REPAIR_PROMPT="The attached QA report identifies a blocker. Verify every claim against current code and fix confirmed blockers. Preserve unrelated work, never modify DevPackages, and do not dismiss findings because a tool call failed. Report exact changes and checks."
              prioritize_models FINAL_REPAIR_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER" "$REPAIR_PROVIDER" "${STAGE_PROVIDER[qa]:-}"
              STAGE_FILES=("$QA_LOG" "$VALIDATION_LOG")
              run_stage "qa-repair" "build" "$FINAL_REPAIR_PROMPT" "${FINAL_REPAIR_MODELS[@]}"
              QA_REPAIR_RESULT=$?
              if [[ "$QA_REPAIR_RESULT" -ne 0 ]]; then
                QA_DECISION="UNAVAILABLE"
                break
              fi
              repair_validation_until_pass
              refresh_diff
              COPILOT_STAGE_ALLOWED=false
              QA_RECHECK_PROMPT="$QA_PROMPT Independently re-check whether the previous QA blocker is actually fixed. Do not trust the repair agent's claim."
              prioritize_models QA_RECHECK_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER" "$REPAIR_PROVIDER" "${STAGE_PROVIDER[qa]:-}"
              STAGE_FILES=("$DIFF_FILE" "$VALIDATION_LOG" "$QA_LOG")
              run_stage "qa-recheck" "qa" "$QA_RECHECK_PROMPT" "${QA_RECHECK_MODELS[@]}"
              QA_RECHECK_RESULT=$?
              if [[ "$QA_RECHECK_RESULT" -ne 0 ]]; then
                QA_DECISION="UNAVAILABLE"
                break
              fi
              QA_LOG="${STAGE_LOG[qa-recheck]:-}"
              QA_DECISION="$(qa_decision "$QA_LOG")"
            done

            if [[ "$QA_DECISION" != "NO" ]]; then
              if [[ "$QA_DECISION" == "YES" ]]; then
                write_recovery_context "Independent QA still confirms a blocker after $QA_REPAIR_ROUNDS repair attempts. Fix the attached finding before unrelated feature work." "$QA_LOG" "$VALIDATION_LOG"
              else
                write_recovery_context "QA blocker repair or independent re-check could not complete. Inspect the attached reports and resolve the blocker before treating this work as complete." "$QA_LOG" "$VALIDATION_LOG"
              fi
              if ! persist_recovery_checkpoint; then
                PIPELINE_EXIT=1
                AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                echo "::error::Unable to preserve unresolved QA recovery work."
                echo "::endgroup::"
                break
              fi
              AUTONOMOUS_RECOVERY_CYCLES=$((AUTONOMOUS_RECOVERY_CYCLES + 1))
              echo "::warning::Unresolved QA work was saved as a recovery checkpoint. Continuing to another autonomous cycle."
              echo "::endgroup::"
              refresh_quota_counts
              if [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
                AUTONOMOUS_STOP_REASON="daily_quota_target_reached_with_recovery_debt"
                PIPELINE_EXIT=1
                break
              fi
              if [[ "$NO_PROGRESS_ROUNDS" -ge "$MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS" ]]; then
                AUTONOMOUS_STOP_REASON="no_meaningful_progress"
                PIPELINE_EXIT=1
                break
              fi
              continue
            fi

            if [[ "$VALIDATION_STATUS" -ne 0 ]]; then
              write_recovery_context "This cycle received independent review and QA, but deterministic validation still fails after bounded repair attempts. Fix every issue in the attached log before unrelated feature work. Do not mark this cycle validated and do not weaken checks." "$VALIDATION_LOG"
              if ! persist_recovery_checkpoint; then
                PIPELINE_EXIT=1
                AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                echo "::error::Unable to preserve the validation-recovery task."
                echo "::endgroup::"
                break
              fi
              AUTONOMOUS_RECOVERY_CYCLES=$((AUTONOMOUS_RECOVERY_CYCLES + 1))
              echo "::warning::Validation still fails, but reviewed/QA-inspected changes and the exact failure report are saved as recovery work. Continuing with another cycle."
              echo "::endgroup::"
              refresh_quota_counts
              if [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
                AUTONOMOUS_STOP_REASON="daily_quota_target_reached_with_recovery_debt"
                PIPELINE_EXIT=1
                break
              fi
              if [[ "$NO_PROGRESS_ROUNDS" -ge "$MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS" ]]; then
                AUTONOMOUS_STOP_REASON="no_meaningful_progress"
                PIPELINE_EXIT=1
                break
              fi
              continue
            fi

            # Green review/QA/CI is necessary but not sufficient to close an
            # existing recovery task. The implementing agent must explicitly
            # mark every automation-resolvable item RECOVERY_STATUS: RESOLVED
            # and provide evidence. Missing/deleted/open notes are never success.
            if [[ "$RECOVERY_CONTEXT_ACTIVE" == "true" ]]; then
              if [[ ! -f "$RECOVERY_CONTEXT_FILE" ]] || ! grep -Eq '^RECOVERY_STATUS:[[:space:]]*RESOLVED[[:space:]]*$' "$RECOVERY_CONTEXT_FILE"; then
                write_recovery_context "Review, QA, and deterministic validation passed for this cycle, but the persistent recovery note is not marked RECOVERY_STATUS: RESOLVED with evidence for every automation-resolvable item. Inspect the checklist, complete any remaining source-level fixes, and update the marker only when genuinely resolved. Do not delete the note to bypass this gate." "$VALIDATION_LOG"
                if ! persist_recovery_checkpoint; then
                  PIPELINE_EXIT=1
                  AUTONOMOUS_STOP_REASON="recovery_checkpoint_persistence_failed"
                  echo "::error::Unable to preserve the still-open recovery checklist."
                  echo "::endgroup::"
                  break
                fi
                AUTONOMOUS_RECOVERY_CYCLES=$((AUTONOMOUS_RECOVERY_CYCLES + 1))
                echo "::warning::Recovery checklist remains open. Green checks alone do not close it; continuing with another recovery cycle."
                echo "::endgroup::"
                refresh_quota_counts
                if [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
                  AUTONOMOUS_STOP_REASON="daily_quota_target_reached_with_recovery_debt"
                  PIPELINE_EXIT=1
                  break
                fi
                if [[ "$NO_PROGRESS_ROUNDS" -ge "$MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS" ]]; then
                  AUTONOMOUS_STOP_REASON="no_meaningful_progress"
                  PIPELINE_EXIT=1
                  break
                fi
                continue
              fi

              # Keep the resolved record as durable audit evidence. The
              # validated checkpoint below commits the RESOLVED marker and its
              # evidence alongside the source fixes. A future failure reopens it.
              RECOVERY_CONTEXT_ACTIVE=false
            fi

            if ! persist_cycle_checkpoint; then
              PIPELINE_EXIT=1
              AUTONOMOUS_STOP_REASON="cycle_checkpoint_persistence_failed"
              echo "::error::Unable to persist the validated cycle; stopping to avoid continuing with uncheckpointed work."
              echo "::endgroup::"
              break
            fi

            AUTONOMOUS_ROUNDS_COMPLETED=$((AUTONOMOUS_ROUNDS_COMPLETED + 1))
            RECOVERY_CONTEXT_ACTIVE=false
            echo "Cycle $round completed: implementation, independent review, deterministic validation, and QA succeeded."
            refresh_quota_counts
            echo "Quota status: $QUOTA_POOL_COOLDOWN_COUNT held / $((QUOTA_POOL_COOLDOWN_COUNT + ELIGIBLE_QUOTA_POOL_COUNT)) eligible pools (${QUOTA_EXHAUSTION_PERCENT}%; target ${QUOTA_EXHAUSTION_TARGET_PERCENT}%)."
            echo "::endgroup::"

            if [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
              AUTONOMOUS_STOP_REASON="daily_quota_target_reached"
              break
            fi
            if [[ "$NO_PROGRESS_ROUNDS" -ge "$MAX_CONSECUTIVE_NO_PROGRESS_ROUNDS" ]]; then
              AUTONOMOUS_STOP_REASON="no_meaningful_progress"
              PIPELINE_EXIT=1
              echo "::warning::Stopping after $NO_PROGRESS_ROUNDS consecutive implementation cycles produced no repository changes."
              break
            fi
            if [[ "$TOTAL_MODEL_CALLS" -ge "$MAX_TOTAL_MODEL_CALLS" ]]; then
              AUTONOMOUS_STOP_REASON="total_model_call_budget"
              PIPELINE_EXIT=1
              break
            fi
          done

          if [[ -z "$AUTONOMOUS_STOP_REASON" ]]; then
            AUTONOMOUS_STOP_REASON="autonomous_round_budget"
            PIPELINE_EXIT=1
          fi
          refresh_quota_counts
          AUTO_CONTINUE=false
          AUTO_CONTINUE_REASON="The stop condition is not an eligible run-local limit."
          QUOTA_RETRY_AT=0
          if (( AUTONOMOUS_ROUNDS_COMPLETED == 0 )); then
            NEXT_NO_PROGRESS_RUNS=$((CONSECUTIVE_NO_PROGRESS_RUNS + 1))
          else
            NEXT_NO_PROGRESS_RUNS=0
          fi
          # A run may hand off after temporary limits, but the chain is bounded
          # unless at least one implementation+review+validation+QA cycle was
          # completed. A validated cycle resets the consecutive-run counter.
          QUOTA_POOL_RESETS_NEXT="$(serialize_quota_pool_reset_state QUOTA_POOL_RESET_AT QUOTA_POOL_KEYS "$(date -u +%s)")"
          MONTHLY_QUOTA_POOL_ENTRIES=()
          for pool_key in "${!MONTHLY_QUOTA_POOL_KEYS[@]}"; do
            if [[ -n "${QUOTA_POOL_RESET_AT[$pool_key]:-}" && -n "${QUOTA_POOL_KEYS[$pool_key]:-}" ]]; then
              MONTHLY_QUOTA_POOL_ENTRIES+=("$pool_key")
            fi
          done
          MONTHLY_QUOTA_POOLS_NEXT=""
          if (( ${#MONTHLY_QUOTA_POOL_ENTRIES[@]} > 0 )); then
            MONTHLY_QUOTA_POOLS_NEXT="$(printf '%s\n' "${MONTHLY_QUOTA_POOL_ENTRIES[@]}" | sort -u | paste -sd, -)"
          fi
          if should_auto_continue_after_run \
            "$AUTONOMOUS_STOP_REASON" \
            "$QUOTA_TARGET_REACHED" \
            "$ELIGIBLE_QUOTA_POOL_COUNT" \
            "$IMPLEMENTATION_RETRYABLE_RUN_LIMIT" \
            "$NEXT_NO_PROGRESS_RUNS" \
            "$MAX_CONSECUTIVE_NO_PROGRESS_RUNS"; then
            AUTO_CONTINUE=true
            case "$AUTONOMOUS_STOP_REASON" in
              no_implementation_progress)
                AUTO_CONTINUE_REASON="run-local model caps or temporary cooldowns blocked implementation while quota pools remain eligible"
                ;;
              total_model_call_budget)
                AUTO_CONTINUE_REASON="per-run total model-call budget reached while quota pools remain eligible"
                ;;
              autonomous_round_budget)
                AUTO_CONTINUE_REASON="per-run autonomous-round budget reached while quota pools remain eligible"
                ;;
            esac
            echo "::notice::Queueing a fresh run to resume from the latest persisted checkpoint: $AUTO_CONTINUE_REASON."
          else
            if (( AUTONOMOUS_ROUNDS_COMPLETED == 0 && NEXT_NO_PROGRESS_RUNS >= MAX_CONSECUTIVE_NO_PROGRESS_RUNS )); then
              AUTO_CONTINUE_REASON="stopped after ${NEXT_NO_PROGRESS_RUNS} consecutive workflow runs without a validated development cycle; manual intervention is required"
              PIPELINE_EXIT=1
              echo "::error::No-progress circuit breaker opened. No further automatic continuation will be dispatched until a validated cycle or a deliberate manual restart."
            elif [[ "$QUOTA_TARGET_REACHED" == "true" ]]; then
              AUTO_CONTINUE_REASON="100% of currently eligible quota pools reached; no continuation needed"
            elif [[ "$ELIGIBLE_QUOTA_POOL_COUNT" -eq 0 ]]; then
              AUTO_CONTINUE_REASON="no eligible quota pools remain"
            elif [[ "$AUTONOMOUS_STOP_REASON" == "no_implementation_progress" && "$IMPLEMENTATION_RETRYABLE_RUN_LIMIT" != "true" ]]; then
              AUTO_CONTINUE_REASON="models ran but failed to produce source changes; automatic retry would risk a no-progress loop"
            fi
          fi

          # A separate scheduled workflow handles 100%-exhausted quota runs.
          # It waits until every non-monthly pool has reset, then dispatches a
          # fresh workflow run without occupying a six-hour runner or retrying
          # early at the first provider reset.

          # A retryable run-local limit is a completed handoff, not a terminal
          # pipeline failure. The follow-up dispatch step below must still
          # succeed; a failed persistence/dispatch remains a failure.
          if [[ "$AUTO_CONTINUE" == "true" && "$PIPELINE_EXIT" -ne 0 ]]; then
            PIPELINE_EXIT=0
            echo "::notice::This run is handing off to a fresh continuation. The full development task is not complete yet."
          fi

          if (( AUTONOMOUS_ROUNDS_COMPLETED > 0 )); then
            DEVELOPMENT_RESULT="VALIDATED DEVELOPMENT PROGRESS"
          elif [[ "$AUTO_CONTINUE" == "true" ]]; then
            DEVELOPMENT_RESULT="HANDOFF ONLY — ZERO VALIDATED DEVELOPMENT CYCLES"
          else
            DEVELOPMENT_RESULT="NO VALIDATED DEVELOPMENT PROGRESS — AUTOMATIC CONTINUATION STOPPED"
          fi
          echo "Development result: $DEVELOPMENT_RESULT"
          echo "Consecutive zero-cycle runs: $CONSECUTIVE_NO_PROGRESS_RUNS -> $NEXT_NO_PROGRESS_RUNS (limit $MAX_CONSECUTIVE_NO_PROGRESS_RUNS)"
          echo "Autonomous cycles completed: $AUTONOMOUS_ROUNDS_COMPLETED"
          echo "Total model calls: $TOTAL_MODEL_CALLS/$MAX_TOTAL_MODEL_CALLS"
          echo "Autonomous stop reason: $AUTONOMOUS_STOP_REASON"
          # Machine-readable per-run usage log plus a compact human report are
          # uploaded even if a required model stage is exhausted.
          {
            echo "# Pocket Habitat AI pipeline report"
            echo
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- **Development result: ${DEVELOPMENT_RESULT}**"
            echo "- Consecutive zero-cycle runs: ${CONSECUTIVE_NO_PROGRESS_RUNS} -> ${NEXT_NO_PROGRESS_RUNS} (automatic handoff limit: ${MAX_CONSECUTIVE_NO_PROGRESS_RUNS})"
            echo "- Task: ${TASK}"
            echo "- Execution mode: LIVE MULTI-CYCLE"
            echo "- Models configured: ${#MODEL_CHAIN[@]}"
            echo "- Quota pools: ${#QUOTA_POOL_KEYS[@]}"
            echo "- Quota pools held until reset: ${QUOTA_POOL_COOLDOWN_COUNT}"
            echo "- Previously held pools carried from earlier continuation runs: ${PREVIOUSLY_EXHAUSTED_POOL_COUNT}"
            echo "- Eligible quota pools remaining: ${ELIGIBLE_QUOTA_POOL_COUNT}"
            echo "- Permanently ineligible quota pools: ${INELIGIBLE_QUOTA_POOL_COUNT}"
            echo "- Quota exhaustion: ${QUOTA_EXHAUSTION_PERCENT}% (target: ${QUOTA_EXHAUSTION_TARGET_PERCENT}%)"
            echo "- Quota target reached: ${QUOTA_TARGET_REACHED}"
            echo "- Automatic continuation requested: ${AUTO_CONTINUE}"
            echo "- Provider-aware quota reset state: ${QUOTA_POOL_RESETS_NEXT:-none}"
            echo "- Monthly quota pools excluded from reset wait: ${MONTHLY_QUOTA_POOLS_NEXT:-none}"
            echo "- Continuation decision: ${AUTO_CONTINUE_REASON}"
            echo "- Autonomous cycles completed: ${AUTONOMOUS_ROUNDS_COMPLETED}/${MAX_AUTONOMOUS_ROUNDS}"
            echo "- Total model calls: ${TOTAL_MODEL_CALLS}/${MAX_TOTAL_MODEL_CALLS}"
            echo "- Reviewed and validated cycle checkpoints pushed: ${PERSISTED_CYCLE_CHECKPOINTS}"
            echo "- Recovery checkpoints pushed (review/QA/validation follow-up required): ${PERSISTED_RECOVERY_CHECKPOINTS}"
            echo "- Autonomous recovery cycles: ${AUTONOMOUS_RECOVERY_CYCLES}"
            echo "- Validation recovery cycles: ${VALIDATION_RECOVERY_CYCLES}"
            echo "- Unresolved recovery context at stop: ${RECOVERY_CONTEXT_ACTIVE}"
            echo "- Models at per-run call cap: ${#MODEL_RUN_CAP_REACHED[@]}"
            echo "- Stop reason: ${AUTONOMOUS_STOP_REASON}"
            echo "- Automatic temporary-limit wait: ${TOTAL_TEMP_WAIT_SECONDS}s across ${TEMP_LIMIT_EVENTS} classified events"
            echo "- Quota exhaustion events: ${QUOTA_EXHAUSTION_EVENTS}"
            echo "- Per-model call cap: ${MAX_MODEL_CALLS_PER_MODEL}; per-stage temporary-failure cap: ${MAX_MODEL_TEMP_ATTEMPTS}"
            echo "- Per-stage wait budget: ${STAGE_TEMP_WAIT_BUDGET_SECONDS}s; workflow-wide wait budget: ${TOTAL_TEMP_WAIT_BUDGET_SECONDS}s"
            echo
            echo "| Latest stage | Result | Model | Provider |"
            echo "|---|---|---|---|"
            for stage in implementation review review-fallback repair validation-repair qa qa-fallback qa-repair qa-recheck; do
              printf '| %s | %s | %s | %s |\n' "$stage" "${STAGE_STATUS[$stage]:-NOT RUN}" "${STAGE_MODEL[$stage]:-—}" "${STAGE_PROVIDER[$stage]:-—}"
            done
            printf '| deterministic-validation | %s | — | CI tools |\n' "${VALIDATION_STATUS:-NOT RUN}"
            echo
            echo "## Provider/model attempt log"
            echo
            echo 'See the accompanying TSV artifact for every attempt grouped by autonomous cycle.'
            echo
            echo "## Quota accounting note"
            echo
            echo "Quota exhaustion is detected from explicit provider/model errors. Resets are provider-aware: Google at midnight Pacific; OpenRouter and Cloudflare at 00:00 UTC; GitHub Copilot at the first UTC day of the month; Cohere at the next UTC month boundary as an approximation because its public docs do not state an exact reset clock; Groq uses x-ratelimit-reset-requests when visible in the transcript and otherwise a conservative 24-hour fallback. The workflow does not query live account balances. Transient rate limits, request-size errors, authentication failures, and unavailable models do not count as exhausted quota."
            echo
            echo "## Billing safety"
            echo
            echo "The total model-call cap limits request count, not monetary spend. Confirm each provider's free-tier/billing status and configure spending limits in provider dashboards before using a long quota-focused run."
            echo
            echo "## Testing boundaries"
            echo
            echo "- Workflow preflight checks: model registry validation, continuation-policy regression tests, and the initial Rojo toolchain build."
            if [[ -s "$VALIDATION_LOG" ]]; then
              echo "- Deterministic validation results:"
              while IFS= read -r validation_line; do
                case "$validation_line" in
                  PASS:*|FAIL:*) echo "  - $validation_line" ;;
                esac
              done < "$VALIDATION_LOG"
            else
              echo "- Deterministic validation (project Rojo build, StyLua, Selene): NOT RUN; no implementation diff reached the validation stage."
            fi
            echo "- TestEZ, Roblox engine, multiplayer, and manual Studio testing are not claimed unless explicitly run by a separately supported test runner or human playtest."
            echo "- The .rbxl file is a build artifact only; a successful Rojo build does not prove the experience is playable in Roblox Studio."
          } > "$RUN_REPORT"

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat "$RUN_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "===== PER-RUN MODEL USAGE ====="
          cat "$USAGE_LOG"
          echo "===== PIPELINE REPORT ====="
          cat "$RUN_REPORT"
          echo "auto_continue=$AUTO_CONTINUE" >> "$GITHUB_OUTPUT"
          echo "development_cycles=$AUTONOMOUS_ROUNDS_COMPLETED" >> "$GITHUB_OUTPUT"
          echo "development_result=$DEVELOPMENT_RESULT" >> "$GITHUB_OUTPUT"
          echo "no_progress_runs_next=$NEXT_NO_PROGRESS_RUNS" >> "$GITHUB_OUTPUT"
          echo "quota_pool_resets=$QUOTA_POOL_RESETS_NEXT" >> "$GITHUB_OUTPUT"
          echo "monthly_quota_pools=$MONTHLY_QUOTA_POOLS_NEXT" >> "$GITHUB_OUTPUT"
          echo "quota_retry_at=$QUOTA_RETRY_AT" >> "$GITHUB_OUTPUT"
          echo "quota_day=$QUOTA_STATE_DAY" >> "$GITHUB_OUTPUT"
          echo "exhausted_quota_pools=" >> "$GITHUB_OUTPUT"

          exit "$PIPELINE_EXIT"

      - name: Persist work to GitHub
        id: persist
        if: always() && steps.pipeline.outputs.safe_to_persist == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Vendored TestEZ/Wally source is not project-owned code. Restore it
          # if an agent or dependency command unexpectedly touched it.
          if [[ -n "$(git status --porcelain -- DevPackages)" ]]; then
            echo "::warning::Restoring unexpected changes and untracked files under vendored DevPackages."
            git restore --source=HEAD --staged --worktree -- DevPackages
            git clean -fd -- DevPackages
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AI staged development checkpoint ${GITHUB_RUN_NUMBER}"
            source "$RUNNER_TEMP/pocket-habitat-push-checkpoint.sh"
            ACTIVE_ROUND=0
            push_checkpoint_with_retry origin refs/heads/ai/game-build
          else
            echo "No repository changes to persist."
          fi

      - name: Save generated build and pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-habitat-pipeline-${{ github.run_number }}
          path: |
            build/pocket-habitat.rbxl
            ${{ runner.temp }}/pocket-habitat-agent-report.md
            ${{ runner.temp }}/pocket-habitat-model-usage.tsv
            ${{ runner.temp }}/pocket-habitat-validation.log
            docs/AUTONOMOUS_RECOVERY.md
            ${{ runner.temp }}/opencode-*.log
          if-no-files-found: warn
          retention-days: 14

      - name: Dispatch fresh continuation run
        id: dispatch
        if: always() && !cancelled() && github.run_attempt == 1 && steps.pipeline.outputs.auto_continue == 'true' && (steps.persist.outcome == 'success' || steps.persist.outcome == 'skipped')
        env:
          GH_TOKEN: ${{ github.token }}
          TASK: ${{ inputs.task }}
          IS_CONTINUATION: "true"
          QUOTA_POOL_RESETS: ${{ steps.pipeline.outputs.quota_pool_resets }}
          MONTHLY_QUOTA_POOLS: ${{ steps.pipeline.outputs.monthly_quota_pools }}
          QUOTA_RETRY_AT: ${{ steps.pipeline.outputs.quota_retry_at }}
          NO_PROGRESS_RUNS_NEXT: ${{ steps.pipeline.outputs.no_progress_runs_next }}
        shell: bash
        run: |
          set -euo pipefail
          : "${GH_TOKEN:?GitHub token is unavailable; cannot dispatch continuation}"
          if [[ "${QUOTA_RETRY_AT:-0}" =~ ^[0-9]+$ ]] && (( QUOTA_RETRY_AT > 0 )); then
            NOW_EPOCH="$(date -u +%s)"
            WAIT_SECONDS=$((QUOTA_RETRY_AT - NOW_EPOCH))
            if (( WAIT_SECONDS > 0 )); then
              echo "::notice::Waiting ${WAIT_SECONDS}s for the next quota reset before dispatching recovery."
              sleep "$WAIT_SECONDS"
            fi
          fi
          gh workflow run ai-build.yml \
            --repo "$GITHUB_REPOSITORY" \
            --ref main \
            --raw-field "task=$TASK" \
            --raw-field "is_continuation=$IS_CONTINUATION" \
            --raw-field "quota_pool_resets=$QUOTA_POOL_RESETS" \
            --raw-field "monthly_quota_pools=$MONTHLY_QUOTA_POOLS" \
            --raw-field "consecutive_no_progress_runs=$NO_PROGRESS_RUNS_NEXT"
          echo "::notice::A continuation run was dispatched. It will start after the current run releases the workflow concurrency lock."

      - name: Verify continuation handoff
        if: always() && github.run_attempt == 1 && steps.pipeline.outputs.auto_continue == 'true' && steps.dispatch.outcome != 'success'
        shell: bash
        run: |
          echo "::error::A continuation was required, but persistence or dispatch did not complete successfully."
          exit 1
