name: Autonomous Roblox Builder

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the autonomous development pipeline
        required: true
        type: string
        default: "Read AGENTS.md and continue the next incomplete milestone."

permissions:
  contents: write

concurrency:
  group: roblox-ai-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout AI build branch
        uses: actions/checkout@v7
        with:
          ref: ai/game-build
          persist-credentials: true

      - name: Install Roblox toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit --version
          rokit install --no-trust-check
          wally install
          rojo --version
          stylua --version
          selene --version
          wally --version
          rojo build default.project.json -o "$RUNNER_TEMP/pocket-habitat-toolchain-check.rbxl"

      - name: Validate OpenCode model registry
        shell: bash
        run: |
          set -euo pipefail
          jq -e '.providers.google.models and .providers.cohere.models and .providers.openrouter.models and .providers["cloudflare-workers-ai"].models' opencode.json >/dev/null
          echo "OpenCode provider/model registry is valid JSON and required provider sections exist."

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version
          opencode run --help

          # Copilot Free is available as an optional CLI adapter, not an
          # OpenCode API model. Installation is best-effort.
          if curl -fsSL https://gh.io/copilot-install | bash; then
            echo "$HOME/.local/bin" >> "$GITHUB_PATH"
            export PATH="$HOME/.local/bin:$PATH"
            if command -v copilot >/dev/null 2>&1; then
              copilot --version
            else
              echo "::warning::Copilot CLI executable not found; Copilot fallback will be unavailable."
            fi
          else
            echo "::warning::Copilot CLI installation failed; other providers remain available."
          fi

      - name: Run staged multi-agent development pipeline
        id: pipeline
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_GITHUB_TOKEN }}
          TASK: ${{ inputs.task }}
          NO_COLOR: "1"
        shell: bash
        run: |
          # Do not let one model's non-zero exit terminate the router before
          # its output can be classified. Every stage has its own fresh session.
          set +e
          set -uo pipefail

          mkdir -p build
          RUN_REPORT="$RUNNER_TEMP/pocket-habitat-agent-report.md"
          USAGE_LOG="$RUNNER_TEMP/pocket-habitat-model-usage.tsv"
          VALIDATION_LOG="$RUNNER_TEMP/pocket-habitat-validation.log"
          DIFF_FILE="$RUNNER_TEMP/pocket-habitat-implementation.diff"
          printf 'stage\tprovider\tmodel\tattempt\tresult\tdetail\n' > "$USAGE_LOG"

          # MODEL_ATTEMPTED means a model already completed a stage successfully.
          # Temporary failures are tracked separately so cooled-down routes can
          # be retried without asking the user to dispatch the workflow again.
          declare -A MODEL_ATTEMPTED=()
          declare -A MODEL_BLOCKED=()
          declare -A PROVIDER_BLOCKED=()
          declare -A MODEL_STAGE_RETRIES=()
          declare -A MODEL_STAGE_EXHAUSTED=()
          declare -A MODEL_COOLDOWN_UNTIL=()
          declare -A PROVIDER_COOLDOWN_UNTIL=()
          declare -A STAGE_STATUS=()
          declare -A STAGE_MODEL=()
          declare -A STAGE_PROVIDER=()
          declare -A STAGE_LOG=()
          MODEL_CHAIN=()
          STAGE_FILES=()
          RUN_COUNTER=0
          PIPELINE_EXIT=0
          # Each stage may automatically wait for transient limits for up to
          # 2 hours; total workflow sleep is capped at 4 hours, below the
          # 350-minute job timeout. Explicit daily/shared quotas are skipped.
          MAX_MODEL_TEMP_ATTEMPTS=4
          MAX_STAGE_MODEL_CALLS=50
          STAGE_TEMP_WAIT_BUDGET_SECONDS=7200
          TOTAL_TEMP_WAIT_BUDGET_SECONDS=14400
          TOTAL_TEMP_WAIT_SECONDS=0
          TEMP_LIMIT_EVENTS=0
          DAILY_QUOTA_EVENTS=0
          IMPLEMENT_PROVIDER=""
          REVIEW_PROVIDER=""
          REPAIR_PROVIDER=""

          provider_for_model() {
            case "$1" in
              google/*) echo "google" ;;
              groq/*) echo "groq" ;;
              openrouter/*) echo "openrouter" ;;
              cohere/*) echo "cohere" ;;
              cloudflare-workers-ai/*) echo "cloudflare-workers-ai" ;;
              github-copilot/*) echo "github-copilot" ;;
              *) echo "unknown" ;;
            esac
          }

          if [[ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "google/gemini-3.5-flash-lite"
              "google/gemini-3.1-flash-lite"
              "google/gemini-3.8-flash"
              "google/gemma-4-31b-it"
              "google/gemma-4-26b-a4b-it"
            )
          fi
          if [[ -n "${CLOUDFLARE_ACCOUNT_ID:-}" && -n "${CLOUDFLARE_API_TOKEN:-}" ]]; then
            MODEL_CHAIN+=("cloudflare-workers-ai/glm-4.7-flash")
          fi
          if [[ -n "${COHERE_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "cohere/north-mini-code"
              "cohere/command-a-plus"
              "cohere/command-a-reasoning"
            )
          fi
          if [[ -n "${GROQ_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "groq/qwen/qwen3.8-27b"
              "groq/openai/gpt-oss-120b"
              "groq/openai/gpt-oss-20b"
            )
          fi
          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
              "openrouter/cohere/north-mini-code:free"
              "openrouter/recursive/flint-v1.0:free"
              "openrouter/thinkingmachines/inkling-2-small:free"
              "openrouter/baidu/ernie-5.5-flash-preview:free"
              "openrouter/nvidia/nemotron-3.5-lightning:free"
              "openrouter/nvidia/nemotron-3.5-super-vl:free"
            )
          fi

          # Copilot Free exposes an Auto model through its CLI adapter.
          if [[ -n "${COPILOT_GITHUB_TOKEN:-}" ]] && command -v copilot >/dev/null 2>&1; then
            MODEL_CHAIN+=("github-copilot/auto")
          fi

          if [[ "${#MODEL_CHAIN[@]}" -eq 0 ]]; then
            echo "::error::No model provider credentials are configured."
            echo "Configure at least one provider: GEMINI_API_KEY, GROQ_API_KEY, OPENROUTER_API_KEY, COHERE_API_KEY, both Cloudflare secrets, or COPILOT_GITHUB_TOKEN."
            exit 1
          fi

          record_attempt() {
            printf '%s\t%s\t%s\t%s\t%s\t%s\n' "$1" "$2" "$3" "$4" "$5" "${6:-}" >> "$USAGE_LOG"
          }

          # Cloudflare Workers AI Free uses account-wide daily Neurons
          # allocations. Keep this detector separate so the provider-specific
          # exhausted-pool response is handled before any RPM/TPM retry logic.
          is_cloudflare_daily_neurons_exhausted() {
            grep -Eiq 'used up.{0,100}daily free allocation|daily free allocation|daily.{0,80}allocation.{0,80}neurons|neurons.{0,80}daily.{0,80}(allocation|quota|limit)' "$1"
          }

          # Classify failures before deciding whether to retry, cool down, or
          # disable a route. Daily exhaustion and oversized requests are never
          # mistaken for ordinary transient 429s.
          classify_failure() {
            local provider="$1"
            local log_file="$2"

            if [[ "$provider" == "cloudflare-workers-ai" ]] && is_cloudflare_daily_neurons_exhausted "$log_file"; then
              echo "SHARED_DAILY_QUOTA"
              return 0
            fi

            if grep -Eiq 'request too large for model|expected output tokens exceed|reduce max_tokens|prompt.{0,30}(too large|exceeds).{0,30}(limit|maximum)|maximum request size exceeded' "$log_file"; then
              echo "REQUEST_TOO_LARGE"
              return 0
            fi

            # Google Generative Language API reports free-tier daily request
            # exhaustion as RESOURCE_EXHAUSTED plus a metric name and a
            # per-day limit. The wording can place many characters between
            # "quota exceeded" and "per day", so match the metric explicitly
            # before the broad 429/RESOURCE_EXHAUSTED rate-limit detector.
            if [[ "$provider" == "google" ]] && grep -Eiq 'generate_content_free_tier_requests|free_tier_requests.{0,160}(per day|daily)|quota exceeded for metric.{0,200}(per day|daily)' "$log_file"; then
              echo "MODEL_DAILY_QUOTA"
              return 0
            fi

            if grep -Eiq 'requests per day|tokens per day|per-day limit|daily quota|daily limit|daily free allocation|used up.{0,100}daily.{0,100}allocation|quota.{0,200}(per day|per-day|daily)|RPD|TPD|requests per month|monthly quota|monthly limit|quota.{0,30}(per month|monthly)|monthly.{0,30}calls|AI credits.{0,30}(exhausted|limit)|premium request.{0,30}(exhausted|limit)|neurons.{0,30}(exhausted|limit)|workers ai.{0,30}(quota|limit)' "$log_file"; then
              case "$provider" in
                openrouter|cohere|cloudflare-workers-ai|github-copilot)
                  echo "SHARED_DAILY_QUOTA"
                  ;;
                *)
                  # Google Gemini free-tier request/day limits are model-specific.
                  echo "MODEL_DAILY_QUOTA"
                  ;;
              esac
              return 0
            fi

            if grep -Eiq 'unauthorized|invalid.{0,20}api.?key|API key.{0,20}invalid|invalid_api_key|authentication failed|HTTP 401|HTTP 403|forbidden.{0,20}api|provider.{0,20}not configured|permission denied' "$log_file"; then
              echo "AUTH_FAILURE"
              return 0
            fi

            if grep -Eiq 'model.{0,20}(not found|unavailable)|no model is available|no longer available|not available to new users|retired model|deprecated model|context length.{0,20}(exceeded|limit)|context window.{0,20}(exceeded|limit)|input too long|maximum context|insufficient credits|not enough credits|payment required' "$log_file"; then
              echo "MODEL_UNAVAILABLE"
              return 0
            fi

            if grep -Eiq 'requests per minute|tokens per minute|input tokens per minute|output tokens per minute|per-minute limit|requests-per-minute|tokens-per-minute|429|RESOURCE_EXHAUSTED|rate.?limit|too many requests|quota exceeded|trial key.{0,80}limited to.{0,40}(minute|second)|retry-after|please retry.{0,40}(in|after)|retry.{0,20}(in|after).{0,20}[0-9]' "$log_file"; then
              if { [[ "$provider" == "cohere" ]] && grep -Eiq 'trial key.{0,80}limited to.{0,40}(minute|second)' "$log_file"; } ||
                 [[ "$provider" == "openrouter" || "$provider" == "cloudflare-workers-ai" || "$provider" == "github-copilot" ]]; then
                echo "PROVIDER_RATE_LIMIT"
              else
                echo "MODEL_RATE_LIMIT"
              fi
              return 0
            fi

            if grep -Eiq 'temporarily unavailable|temporarily overloaded|overloaded|over capacity|service unavailable|HTTP 5[0-9][0-9]|high demand|spikes in demand|try again later|timed out|timeout|connection reset|ECONNRESET|ETIMEDOUT|socket hang up|gateway error|internal error encountered|internal server error|upstream error|server is busy|fetch failed' "$log_file"; then
              echo "TEMP_CAPACITY"
              return 0
            fi

            echo "UNKNOWN"
          }

          # Honor provider-supplied Retry-After / "Please retry in 43.4s" hints.
          # If no hint exists, use exponential backoff with a conservative cap.
          retry_delay_seconds() {
            local log_file="$1"
            local attempt_number="$2"
            local failure_class="$3"
            python3 - "$log_file" "$attempt_number" "$failure_class" <<'PY'
          import datetime
          import email.utils
          import math
          import re
          import sys

          path, attempt_text, failure_class = sys.argv[1:4]
          try:
              text = open(path, "r", encoding="utf-8", errors="replace").read()
          except OSError:
              text = ""

          delay = None
          duration = r"((?:[0-9]+(?:\.[0-9]+)?h(?:[0-9]+(?:\.[0-9]+)?m)?(?:[0-9]+(?:\.[0-9]+)?s)?|[0-9]+(?:\.[0-9]+)?m(?:[0-9]+(?:\.[0-9]+)?s)?|[0-9]+(?:\.[0-9]+)?s))"
          matches = list(re.finditer(r"(?:retry|try again)\s+(?:in|after)\s+" + duration, text, re.I))
          if matches:
              raw = matches[-1].group(1).lower()
              hours = re.search(r"([0-9]+(?:\.[0-9]+)?)h", raw)
              minutes = re.search(r"([0-9]+(?:\.[0-9]+)?)m", raw)
              seconds = re.search(r"([0-9]+(?:\.[0-9]+)?)s", raw)
              delay = (
                  (float(hours.group(1)) * 3600 if hours else 0)
                  + (float(minutes.group(1)) * 60 if minutes else 0)
                  + (float(seconds.group(1)) if seconds else 0)
              )
          else:
              seconds_matches = list(re.finditer(
                  r"(?:retry|try again)\s+(?:in|after)\s+([0-9]+(?:\.[0-9]+)?)\s+seconds?",
                  text, re.I
              ))
              header_matches = list(re.finditer(r"retry-after\s*:\s*([^\r\n]+)", text, re.I))
              if seconds_matches:
                  delay = float(seconds_matches[-1].group(1))
              elif header_matches:
                  header = header_matches[-1].group(1).strip()
                  if re.fullmatch(r"[0-9]+(?:\.[0-9]+)?", header):
                      delay = float(header)
                  else:
                      try:
                          retry_at = email.utils.parsedate_to_datetime(header)
                          if retry_at.tzinfo is None:
                              retry_at = retry_at.replace(tzinfo=datetime.timezone.utc)
                          delay = max(0, (retry_at - datetime.datetime.now(datetime.timezone.utc)).total_seconds())
                      except (TypeError, ValueError, OverflowError):
                          delay = None

          if delay is None:
              try:
                  attempt = max(1, int(attempt_text))
              except ValueError:
                  attempt = 1
              base = 45 if failure_class == "TEMP_CAPACITY" else 30
              delay = min(base * (2 ** (attempt - 1)), 300)

          print(max(15, math.ceil(delay) + 5))
          PY
          }

          # Return YES, NO, or INVALID from a reviewer transcript. Strip terminal
          # color codes first because some CLI renderers decorate the first line.
          review_decision() {
            local normalized
            if [[ ! -f "$1" ]]; then
              echo "INVALID"
              return 0
            fi

            normalized="$(sed -E $'s/\x1B\\[[0-9;]*[[:alpha:]]//g' "$1")"
            if grep -Eq '^[[:space:]]*REVIEW_FINDINGS:[[:space:]]*YES[[:space:]]*$' <<< "$normalized"; then
              echo "YES"
            elif grep -Eq '^[[:space:]]*REVIEW_FINDINGS:[[:space:]]*NO[[:space:]]*$' <<< "$normalized"; then
              echo "NO"
            else
              echo "INVALID"
            fi
          }

          # Regression tests: recognize the documented exhausted-allocation
          # wording, but do not misclassify an ordinary per-minute rate limit.
          quota_classifier_test_file="$RUNNER_TEMP/cloudflare-quota-classifier-test.log"
          printf '%s\n' 'Error: You have used up your daily free allocation of 10,000 neurons.' > "$quota_classifier_test_file"
          if ! is_cloudflare_daily_neurons_exhausted "$quota_classifier_test_file"; then
            echo "::error::Cloudflare daily Neurons quota classifier failed its positive regression test."
            exit 1
          fi
          printf '%s\n' 'Error: input tokens per minute limit exceeded.' > "$quota_classifier_test_file"
          if is_cloudflare_daily_neurons_exhausted "$quota_classifier_test_file"; then
            echo "::error::Cloudflare daily Neurons quota classifier incorrectly matched an RPM/TPM error."
            exit 1
          fi
          rm -f "$quota_classifier_test_file"
          echo "Cloudflare daily Neurons quota classifier regression tests passed."

          # Regression coverage for model/provider failure classification.
          classifier_test_file="$RUNNER_TEMP/model-failure-classifier-test.log"
          assert_failure_class() {
            local provider="$1"
            local fixture="$2"
            local expected="$3"
            printf '%s\n' "$fixture" > "$classifier_test_file"
            local actual
            actual="$(classify_failure "$provider" "$classifier_test_file")"
            if [[ "$actual" != "$expected" ]]; then
              echo "::error::Failure classifier mismatch for $provider: expected $expected, got $actual"
              exit 1
            fi
          }
          assert_failure_class "google" 'Quota exceeded for metric generate_content_free_tier_requests; limit 20 per day.' "MODEL_DAILY_QUOTA"
          assert_failure_class "google" 'google.api_core.exceptions.ResourceExhausted: 429 Quota exceeded for metric: generate_content_free_tier_requests; limit: 20 per day.' "MODEL_DAILY_QUOTA"
          assert_failure_class "google" 'Generate content free tier input token count per minute limit exceeded. Please retry in 43.4s.' "MODEL_RATE_LIMIT"
          assert_failure_class "google" 'Generate content free tier requests per minute limit exceeded. Please retry in 43.4s.' "MODEL_RATE_LIMIT"
          assert_failure_class "google" 'Please retry in 43.4s.' "MODEL_RATE_LIMIT"
          assert_failure_class "groq" 'Request too large for model; input tokens per minute Limit 7000, Requested 12283.' "REQUEST_TOO_LARGE"
          assert_failure_class "cohere" 'Trial key is limited to 20 API calls / minute.' "PROVIDER_RATE_LIMIT"
          assert_failure_class "openrouter" 'HTTP 429 rate limit exceeded.' "PROVIDER_RATE_LIMIT"
          assert_failure_class "google" 'This model is currently experiencing high demand. Try again later.' "TEMP_CAPACITY"
          assert_failure_class "google" 'Invalid API key: authentication failed.' "AUTH_FAILURE"
          rm -f "$classifier_test_file"
          echo "Model failure classifier regression tests passed."

          retry_delay_test_file="$RUNNER_TEMP/model-retry-delay-test.log"
          printf '%s\n' 'Please retry in 43.440153729s.' > "$retry_delay_test_file"
          parsed_retry_delay="$(retry_delay_seconds "$retry_delay_test_file" 1 MODEL_RATE_LIMIT)"
          if [[ "$parsed_retry_delay" -lt 48 || "$parsed_retry_delay" -gt 50 ]]; then
            echo "::error::Retry delay parser failed the seconds-hint regression test: $parsed_retry_delay"
            exit 1
          fi
          printf '%s\n' 'Retry-After: 120' > "$retry_delay_test_file"
          parsed_retry_delay="$(retry_delay_seconds "$retry_delay_test_file" 1 MODEL_RATE_LIMIT)"
          if [[ "$parsed_retry_delay" -lt 125 || "$parsed_retry_delay" -gt 126 ]]; then
            echo "::error::Retry-After parser failed the header regression test: $parsed_retry_delay"
            exit 1
          fi
          rm -f "$retry_delay_test_file"
          echo "Retry delay parser regression tests passed."

          review_classifier_test_file="$RUNNER_TEMP/review-classifier-test.log"
          printf '%s\n' 'REVIEW_FINDINGS: YES' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "YES" ]]; then
            echo "::error::Reviewer response classifier failed its YES regression test."
            exit 1
          fi
          printf '%s\n' 'REVIEW_FINDINGS: NO' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "NO" ]]; then
            echo "::error::Reviewer response classifier failed its NO regression test."
            exit 1
          fi
          printf '%s\n' 'Reviewer returned a summary without the required decision.' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "INVALID" ]]; then
            echo "::error::Reviewer response classifier failed its invalid-output regression test."
            exit 1
          fi
          printf '\033[32mREVIEW_FINDINGS: YES\033[0m\n' > "$review_classifier_test_file"
          if [[ "$(review_decision "$review_classifier_test_file")" != "YES" ]]; then
            echo "::error::Reviewer response classifier failed its ANSI-colored-header regression test."
            exit 1
          fi
          rm -f "$review_classifier_test_file"
          echo "Reviewer response classifier regression tests passed."

          # Keep models from already-used providers later in the list. They
          # remain eligible as a last resort if independent providers are out.
          prioritize_models() {
            local -n output_ref="$1"
            shift
            local -a avoid_providers=("$@")
            local -a preferred=()
            local -a deferred=()
            local model provider avoid

            for model in "${MODEL_CHAIN[@]}"; do
              provider="$(provider_for_model "$model")"
              if [[ "$provider" == "github-copilot" && "${COPILOT_STAGE_ALLOWED:-false}" != "true" ]]; then
                continue
              fi
              avoid="false"
              for blocked_provider in "${avoid_providers[@]}"; do
                if [[ -n "$blocked_provider" && "$provider" == "$blocked_provider" ]]; then
                  avoid="true"
                  break
                fi
              done
              if [[ "$avoid" == "true" ]]; then
                deferred+=("$model")
              else
                preferred+=("$model")
              fi
            done
            output_ref=("${preferred[@]}" "${deferred[@]}")
          }

          # run_stage <stage> <agent> <prompt> <candidate-model...>
          # Temporary limits cool down the affected model/provider, allow other
          # routes to run, and then automatically revisit the original prompt.
          # Daily/shared quota exhaustion and permanent errors are not retried.
          run_stage() {
            local stage="$1"
            local agent="$2"
            local prompt="$3"
            shift 3
            local -a candidates=("$@")
            local model provider status retry_count delay log_file
            local attempt_key cooldown_until provider_cooldown earliest_cooldown now wait_seconds
            local remaining_stage remaining_total failure_class stage_deadline
            local stage_calls stage_temp_events
            local -a command_args=()

            STAGE_STATUS["$stage"]="EXHAUSTED"
            STAGE_MODEL["$stage"]=""
            STAGE_PROVIDER["$stage"]=""
            STAGE_LOG["$stage"]=""

            stage_deadline=$(( $(date +%s) + STAGE_TEMP_WAIT_BUDGET_SECONDS ))
            stage_calls=0
            stage_temp_events=0

            while true; do
              earliest_cooldown=0

              for model in "${candidates[@]}"; do
                provider="$(provider_for_model "$model")"
                attempt_key="$stage|$model"

                if [[ -n "${MODEL_ATTEMPTED[$model]:-}" ]]; then
                  continue
                fi
                if [[ -n "${MODEL_BLOCKED[$model]:-}" || -n "${PROVIDER_BLOCKED[$provider]:-}" ]]; then
                  continue
                fi
                if [[ -n "${MODEL_STAGE_EXHAUSTED[$attempt_key]:-}" ]]; then
                  continue
                fi

                retry_count="${MODEL_STAGE_RETRIES[$attempt_key]:-0}"
                now="$(date +%s)"
                cooldown_until="${MODEL_COOLDOWN_UNTIL[$model]:-0}"
                provider_cooldown="${PROVIDER_COOLDOWN_UNTIL[$provider]:-0}"
                if [[ "$provider_cooldown" -gt "$cooldown_until" ]]; then
                  cooldown_until="$provider_cooldown"
                fi
                if [[ "$cooldown_until" -gt "$now" ]]; then
                  if [[ "$earliest_cooldown" -eq 0 || "$cooldown_until" -lt "$earliest_cooldown" ]]; then
                    earliest_cooldown="$cooldown_until"
                  fi
                  continue
                fi

                if [[ "$stage_calls" -ge "$MAX_STAGE_MODEL_CALLS" ]]; then
                  MODEL_STAGE_EXHAUSTED["$attempt_key"]="per-stage model-call budget reached"
                  continue
                fi

                retry_count=$((retry_count + 1))
                MODEL_STAGE_RETRIES["$attempt_key"]="$retry_count"
                stage_calls=$((stage_calls + 1))
                RUN_COUNTER=$((RUN_COUNTER + 1))
                log_file="$RUNNER_TEMP/opencode-${stage}-$RUN_COUNTER.log"
                echo "::group::${stage}: $model (attempt $retry_count)"

                command_args=(env -i "PATH=$PATH" "HOME=$HOME" "NO_COLOR=1" "GITHUB_WORKSPACE=$GITHUB_WORKSPACE" "RUNNER_TEMP=$RUNNER_TEMP")
                case "$provider" in
                  google) command_args+=("GOOGLE_GENERATIVE_AI_API_KEY=$GOOGLE_GENERATIVE_AI_API_KEY") ;;
                  groq) command_args+=("GROQ_API_KEY=$GROQ_API_KEY") ;;
                  openrouter) command_args+=("OPENROUTER_API_KEY=$OPENROUTER_API_KEY") ;;
                  cohere) command_args+=("COHERE_API_KEY=$COHERE_API_KEY") ;;
                  cloudflare-workers-ai)
                    command_args+=("CLOUDFLARE_API_TOKEN=$CLOUDFLARE_API_TOKEN" "CLOUDFLARE_ACCOUNT_ID=$CLOUDFLARE_ACCOUNT_ID")
                    ;;
                  github-copilot) command_args+=("COPILOT_GITHUB_TOKEN=$COPILOT_GITHUB_TOKEN") ;;
                esac

                if [[ "$provider" == "github-copilot" ]]; then
                  copilot_prompt="$prompt"
                  for attachment in "${STAGE_FILES[@]}"; do
                    if [[ -f "$attachment" ]]; then
                      if [[ "$stage" == "validation-repair" ]]; then
                        copilot_prompt+=$'\n\nBEGIN COMPLETE DETERMINISTIC VALIDATION OUTPUT\n'
                        copilot_prompt+="$(cat "$attachment")"
                        copilot_prompt+=$'\nEND COMPLETE DETERMINISTIC VALIDATION OUTPUT\n'
                      else
                        copilot_prompt+=" Supporting pipeline file to read before acting: $attachment."
                      fi
                    fi
                  done
                  command_args+=(
                    copilot -p "$copilot_prompt" --allow-all-tools
                    --deny-tool='shell(git commit)'
                    --deny-tool='shell(git push)'
                    --deny-tool='shell(gh workflow run)'
                    --deny-tool='shell(gh release create)'
                    --deny-tool='shell(rojo upload)'
                  )
                else
                  command_args+=(
                    opencode run --standalone --auto
                    --model "$model" --agent "$agent"
                    --title "Pocket Habitat $stage run $GITHUB_RUN_NUMBER"
                  )
                  for attachment in "${STAGE_FILES[@]}"; do
                    if [[ -f "$attachment" ]]; then
                      command_args+=(--file "$attachment")
                    fi
                  done
                  command_args+=("$prompt")
                fi

                if "${command_args[@]}" 2>&1 | tee "$log_file"; then
                  status=0
                else
                  status=$?
                fi
                echo "::endgroup::"
                STAGE_LOG["$stage"]="$log_file"

                if [[ "$status" -eq 0 ]]; then
                  MODEL_ATTEMPTED["$model"]="1"
                  STAGE_STATUS["$stage"]="SUCCESS"
                  STAGE_MODEL["$stage"]="$model"
                  STAGE_PROVIDER["$stage"]="$provider"
                  record_attempt "$stage" "$provider" "$model" "$retry_count" "SUCCESS" ""
                  echo "Stage $stage completed using $model."
                  return 0
                fi

                failure_class="$(classify_failure "$provider" "$log_file")"
                now="$(date +%s)"

                case "$failure_class" in
                  SHARED_DAILY_QUOTA)
                    MODEL_BLOCKED["$model"]="shared daily/monthly quota exhausted"
                    PROVIDER_BLOCKED["$provider"]="shared daily/monthly quota exhausted"
                    DAILY_QUOTA_EVENTS=$((DAILY_QUOTA_EVENTS + 1))
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "PROVIDER_DISABLED" "shared daily/monthly quota exhausted; no retry"
                    echo "::warning::$provider shared quota is exhausted; disabling that provider for the remainder of this run."
                    ;;
                  MODEL_DAILY_QUOTA)
                    MODEL_BLOCKED["$model"]="model-specific daily/monthly quota exhausted"
                    DAILY_QUOTA_EVENTS=$((DAILY_QUOTA_EVENTS + 1))
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "MODEL_DISABLED" "model-specific daily/monthly quota exhausted; other provider models remain eligible"
                    echo "::warning::$model has exhausted its model-specific daily quota; other models from $provider remain eligible."
                    ;;
                  REQUEST_TOO_LARGE)
                    MODEL_BLOCKED["$model"]="request exceeds model token/rate limit"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "MODEL_SKIPPED" "request too large for this model; no pointless retry"
                    echo "::warning::$model cannot accept this request size; moving to another model without waiting."
                    ;;
                  AUTH_FAILURE)
                    PROVIDER_BLOCKED["$provider"]="authentication or provider configuration failure"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "PROVIDER_DISABLED" "authentication/configuration failure"
                    echo "::warning::$provider credentials or permissions were rejected; skipping this provider for the run."
                    ;;
                  MODEL_UNAVAILABLE)
                    MODEL_BLOCKED["$model"]="model unavailable or request unsupported"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "MODEL_SKIPPED" "model unavailable or request unsupported"
                    echo "::warning::$model is unavailable for this request; moving on."
                    ;;
                  MODEL_RATE_LIMIT|PROVIDER_RATE_LIMIT|TEMP_CAPACITY)
                    stage_temp_events=$((stage_temp_events + 1))
                    TEMP_LIMIT_EVENTS=$((TEMP_LIMIT_EVENTS + 1))
                    if [[ "$retry_count" -ge "$MAX_MODEL_TEMP_ATTEMPTS" ]]; then
                      MODEL_STAGE_EXHAUSTED["$attempt_key"]="temporary retry count reached"
                      record_attempt "$stage" "$provider" "$model" "$retry_count" "TEMP_RETRIES_EXHAUSTED" "$failure_class; per-model retry cap reached"
                      echo "::warning::$model remains temporarily unavailable after $retry_count attempts; it is deferred for this stage."
                    else
                      delay="$(retry_delay_seconds "$log_file" "$retry_count" "$failure_class")"
                      MODEL_COOLDOWN_UNTIL["$model"]=$((now + delay))
                      if [[ "$failure_class" == "PROVIDER_RATE_LIMIT" ]]; then
                        PROVIDER_COOLDOWN_UNTIL["$provider"]=$((now + delay))
                      fi
                      cooldown_until=$((now + delay))
                      if [[ "$earliest_cooldown" -eq 0 || "$cooldown_until" -lt "$earliest_cooldown" ]]; then
                        earliest_cooldown="$cooldown_until"
                      fi
                      record_attempt "$stage" "$provider" "$model" "$retry_count" "COOLDOWN" "$failure_class; retry scheduled in ${delay}s"
                      echo "::notice::$provider/$model is temporarily limited ($failure_class). Cooling down for ${delay}s; the stage will continue automatically."
                    fi
                    ;;
                  *)
                    MODEL_BLOCKED["$model"]="unclassified failure"
                    record_attempt "$stage" "$provider" "$model" "$retry_count" "MODEL_ERROR" "unclassified exit code $status; continuing fallback"
                    echo "::warning::Unclassified failure from $model (exit code $status); quarantining this model and continuing fallback."
                    ;;
                esac
              done

              # Wait only after all currently available alternatives were tried.
              now="$(date +%s)"
              if [[ "$earliest_cooldown" -gt "$now" ]]; then
                remaining_stage=$((stage_deadline - now))
                remaining_total=$((TOTAL_TEMP_WAIT_BUDGET_SECONDS - TOTAL_TEMP_WAIT_SECONDS))
                wait_seconds=$((earliest_cooldown - now))
                if [[ "$wait_seconds" -gt "$remaining_stage" ]]; then
                  wait_seconds="$remaining_stage"
                fi
                if [[ "$wait_seconds" -gt "$remaining_total" ]]; then
                  wait_seconds="$remaining_total"
                fi
                if [[ "$wait_seconds" -gt 0 ]]; then
                  echo "::notice::All currently available candidates are cooling down. Waiting ${wait_seconds}s, then automatically retrying the original stage prompt."
                  record_attempt "$stage" "scheduler" "automatic-cooldown" "$stage_calls" "WAITING" "waiting ${wait_seconds}s for earliest model/provider cooldown"
                  sleep "$wait_seconds"
                  TOTAL_TEMP_WAIT_SECONDS=$((TOTAL_TEMP_WAIT_SECONDS + wait_seconds))
                  continue
                fi
              fi

              break
            done

            if [[ "$stage_temp_events" -gt 0 ]]; then
              STAGE_STATUS["$stage"]="TEMPORARY_LIMIT_BUDGET_EXHAUSTED"
              echo "::warning::Stage $stage could not complete within its automatic temporary-limit retry budget."
            else
              echo "::warning::No unattempted, available model completed stage $stage."
            fi
            return 1
          }

          refresh_diff() {
            # Intent-to-add makes new project files visible to git diff without
            # staging their content. Third-party DevPackages are excluded.
            git add -N -- . 2>/dev/null || true
            git diff --no-ext-diff --binary HEAD -- . ':(exclude)DevPackages/**' > "$DIFF_FILE"
          }

          run_validation() {
            local result=0
            : > "$VALIDATION_LOG"

            if rojo build default.project.json -o build/pocket-habitat.rbxl >> "$VALIDATION_LOG" 2>&1; then
              echo "PASS: Rojo build -> build/pocket-habitat.rbxl" >> "$VALIDATION_LOG"
            else
              echo "FAIL: Rojo build" >> "$VALIDATION_LOG"
              result=1
            fi

            if stylua --check src >> "$VALIDATION_LOG" 2>&1; then
              echo "PASS: StyLua check src" >> "$VALIDATION_LOG"
            else
              echo "FAIL: StyLua check src" >> "$VALIDATION_LOG"
              result=1
            fi

            if selene src >> "$VALIDATION_LOG" 2>&1; then
              echo "PASS: Selene src" >> "$VALIDATION_LOG"
            else
              echo "FAIL: Selene src" >> "$VALIDATION_LOG"
              result=1
            fi

            VALIDATION_STATUS="$result"
            cat "$VALIDATION_LOG"
            return "$result"
          }

          IMPLEMENT_PROMPT="You are the Pocket Habitat implementation agent. Read AGENTS.md and the relevant project documentation before changing code. Complete the user's task below with working, integrated Luau gameplay rather than disconnected scaffolding. Inspect the current repository state first and preserve correct existing work. Keep gameplay server-authoritative; validate all remote requests, ownership, distance, rewards, inventory, purchases, quests, and persistence. Do not publish to Roblox, access publishing credentials, create/switch branches, commit, or push. Never modify or reformat DevPackages or other vendored dependencies. Format/lint only src/. Run the checks you can actually run and report exact results; never claim Roblox Studio, engine, multiplayer, or TestEZ execution unless it truly happened. Update docs/PROJECT_STATE.md and docs/TESTING.md accurately. User task: ${TASK}"

          echo "Configured models: ${#MODEL_CHAIN[@]}"
          echo "Pipeline stages: implementation -> independent review (with strict-format fallback) -> repair -> deterministic validation -> QA"

          # Stage 1: implementation.
          COPILOT_STAGE_ALLOWED=true
          prioritize_models IMPLEMENT_MODELS
          STAGE_FILES=()
          run_stage "implementation" "build" "$IMPLEMENT_PROMPT" "${IMPLEMENT_MODELS[@]}"
          IMPLEMENT_RESULT=$?
          IMPLEMENT_PROVIDER="${STAGE_PROVIDER[implementation]:-}"

          if [[ "$IMPLEMENT_RESULT" -ne 0 ]]; then
            PIPELINE_EXIT=1
            echo "::error::Implementation did not complete; skipping dependent AI stages."
          else
            # Stage 2: independent, read-only review using a different provider
            # first. Attach a concrete diff so the reviewer does not need shell.
            refresh_diff
            COPILOT_STAGE_ALLOWED=false
            REVIEW_PROMPT="You are an independent, read-only reviewer for Pocket Habitat. Review the attached implementation diff against the repository's actual code and architecture. Do not edit files, run shell commands, or ask another agent to make changes. Verify every suspected issue against the source before reporting it. Prioritize exploitable remote/event flows, player-data loss or cross-player leakage, economy/inventory duplication, broken gameplay interactions, persistence failure handling, runtime errors, and regressions. Ignore style-only opinions unless they cause a real problem. Start with exactly one line: REVIEW_FINDINGS: YES or REVIEW_FINDINGS: NO. Use YES only if at least one actionable defect is confirmed in source. Return a concise Markdown report with severity (CRITICAL/HIGH/MEDIUM/LOW), file and line, evidence, impact, and a specific suggested correction. If no actionable findings exist, use REVIEW_FINDINGS: NO and explain any remaining runtime checks. Do not claim a test was run unless the attached evidence shows it."
            prioritize_models REVIEW_MODELS "$IMPLEMENT_PROVIDER"
            STAGE_FILES=("$DIFF_FILE")
            run_stage "review" "reviewer" "$REVIEW_PROMPT" "${REVIEW_MODELS[@]}"
            REVIEW_RESULT=$?
            REVIEW_PROVIDER="${STAGE_PROVIDER[review]:-}"

            # Stage 3: repair verified findings only. If a reviewer exits
            # successfully but omits the required header, try one additional
            # independent model before treating the review as incomplete.
            REVIEW_LOG_PATH="${STAGE_LOG[review]:-}"
            REVIEW_DECISION="INVALID"
            if [[ "$REVIEW_RESULT" -eq 0 ]]; then
              REVIEW_DECISION="$(review_decision "$REVIEW_LOG_PATH")"
              if [[ "$REVIEW_DECISION" == "INVALID" ]]; then
                STAGE_STATUS["review"]="SUCCESS (invalid response format)"
                echo "::warning::Reviewer output was missing REVIEW_FINDINGS: YES/NO; requesting one independent fallback review."
                REVIEW_FALLBACK_PROMPT="You are an independent, read-only reviewer for Pocket Habitat. Inspect the attached implementation diff and relevant source evidence. Do not edit files or run shell commands. Verify findings against the supplied code. Your FIRST output line MUST be exactly REVIEW_FINDINGS: YES or REVIEW_FINDINGS: NO. Do not put a preamble, Markdown fence, or explanation before it. Use YES only for at least one confirmed actionable defect; otherwise use NO. Then provide concise evidence, severity, file/line, impact, and a specific correction for each confirmed finding. Never claim tests ran unless the evidence proves it."
                prioritize_models REVIEW_FALLBACK_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER"
                STAGE_FILES=("$DIFF_FILE")
                run_stage "review-fallback" "reviewer" "$REVIEW_FALLBACK_PROMPT" "${REVIEW_FALLBACK_MODELS[@]}"
                REVIEW_FALLBACK_RESULT=$?
                if [[ "$REVIEW_FALLBACK_RESULT" -eq 0 ]]; then
                  REVIEW_LOG_PATH="${STAGE_LOG[review-fallback]:-}"
                  REVIEW_DECISION="$(review_decision "$REVIEW_LOG_PATH")"
                  if [[ "$REVIEW_DECISION" == "INVALID" ]]; then
                    STAGE_STATUS["review-fallback"]="SUCCESS (invalid response format)"
                    echo "::warning::Fallback reviewer also omitted the required header; the review remains incomplete."
                  else
                    REVIEW_PROVIDER="${STAGE_PROVIDER[review-fallback]:-}"
                    echo "Independent fallback reviewer returned REVIEW_FINDINGS: $REVIEW_DECISION."
                  fi
                else
                  echo "::warning::No independent fallback reviewer completed the strict-format review."
                fi
              fi
            fi

            if [[ "$REVIEW_RESULT" -ne 0 ]]; then
              PIPELINE_EXIT=1
              STAGE_STATUS["repair"]="SKIPPED (review unavailable)"
              echo "::warning::No independent model completed the review stage; repair stage skipped."
            elif [[ "$REVIEW_DECISION" == "YES" ]]; then
              COPILOT_STAGE_ALLOWED=true
              REPAIR_PROMPT="You are the Pocket Habitat repair engineer. Read the attached independent review output and verify each finding in the current source before changing anything. Fix confirmed CRITICAL and HIGH findings, plus MEDIUM findings that directly break the requested task or core progression. Do not blindly apply speculative comments. Preserve working behavior, keep all server-side validation and data safety, never modify DevPackages, do not publish, and do not commit or push. Run appropriate local checks and accurately update project-state/testing docs. The attached text is the selected independent review report."
              prioritize_models REPAIR_MODELS "$REVIEW_PROVIDER"
              STAGE_FILES=("$REVIEW_LOG_PATH")
              run_stage "repair" "build" "$REPAIR_PROMPT" "${REPAIR_MODELS[@]}"
              REPAIR_RESULT=$?
              REPAIR_PROVIDER="${STAGE_PROVIDER[repair]:-}"
              if [[ "$REPAIR_RESULT" -ne 0 ]]; then
                PIPELINE_EXIT=1
                echo "::warning::The review repair stage could not complete."
              fi
            elif [[ "$REVIEW_DECISION" == "NO" ]]; then
              STAGE_STATUS["repair"]="SKIPPED (no confirmed findings)"
              echo "Independent reviewer found no confirmed actionable defects; repair call not needed."
            else
              PIPELINE_EXIT=1
              STAGE_STATUS["repair"]="SKIPPED (review invalid after fallback)"
              echo "::error::Review could not produce a valid YES/NO decision after the controlled fallback; repair is not safe to run."
            fi

            # Stage 4: deterministic CI validation, independent of model claims.
            run_validation
            if [[ "$VALIDATION_STATUS" -ne 0 ]]; then
              echo "::warning::Initial deterministic validation failed; requesting one focused repair."
              COPILOT_STAGE_ALLOWED=true
              VALIDATION_REPAIR_PROMPT="The complete deterministic validation output is embedded directly in this prompt. Use that output as your evidence; do not try to open a runner-temporary file or request interactive approval to read it. Fix only confirmed failures in project-owned files. Do not modify DevPackages, weaken checks, publish, commit, or push. Then report the exact changes made."
              prioritize_models VALIDATION_REPAIR_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER"
              STAGE_FILES=("$VALIDATION_LOG")
              run_stage "validation-repair" "build" "$VALIDATION_REPAIR_PROMPT" "${VALIDATION_REPAIR_MODELS[@]}"
              VALIDATION_REPAIR_RESULT=$?
              if [[ "$VALIDATION_REPAIR_RESULT" -eq 0 ]]; then
                run_validation
              fi
            fi

            # Stage 5: read-only QA gets both the current diff and actual CI log.
            refresh_diff
            COPILOT_STAGE_ALLOWED=false
            QA_PROMPT="You are the read-only Pocket Habitat QA agent. Inspect the attached current diff and deterministic validation log, then inspect relevant source and tests. Start your response with exactly one line: QA_BLOCKER: YES or QA_BLOCKER: NO. Say YES only when you have verified a concrete critical/high correctness, security, progression, or player-data issue that should block this checkpoint. Otherwise say NO. Report what CI actually passed or failed from the attached log. Identify missing test coverage and Roblox Studio-only checks separately. Do not edit files, run shell commands, or claim unexecuted TestEZ, Roblox engine, multiplayer, or manual playtests passed."
            prioritize_models QA_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER" "$REPAIR_PROVIDER"
            STAGE_FILES=("$DIFF_FILE" "$VALIDATION_LOG")
            run_stage "qa" "qa" "$QA_PROMPT" "${QA_MODELS[@]}"
            QA_RESULT=$?
            if [[ "$QA_RESULT" -ne 0 ]]; then
              PIPELINE_EXIT=1
              echo "::warning::The independent QA stage did not complete; this run will be reported as incomplete."
            fi

            # If QA finds a confirmed blocker, allow one extra repair pass and
            # re-run deterministic checks before the checkpoint is persisted.
            QA_LOG="${STAGE_LOG[qa]:-}"
            if [[ "$QA_RESULT" -eq 0 && -f "$QA_LOG" ]]; then
              if grep -Eiq '^QA_BLOCKER:[[:space:]]*YES' "$QA_LOG"; then
                echo "::warning::QA identified a blocker; starting one focused final repair."
                COPILOT_STAGE_ALLOWED=true
                FINAL_REPAIR_PROMPT="The attached QA report identifies a possible blocking issue. Verify it against the current code and fix it only if confirmed. Preserve unrelated work, never modify DevPackages, do not publish, and do not commit or push. Update documentation and report exact checks."
                prioritize_models FINAL_REPAIR_MODELS "$IMPLEMENT_PROVIDER" "$REVIEW_PROVIDER" "$REPAIR_PROVIDER" "${STAGE_PROVIDER[qa]:-}"
                STAGE_FILES=("$QA_LOG" "$VALIDATION_LOG")
                run_stage "qa-repair" "build" "$FINAL_REPAIR_PROMPT" "${FINAL_REPAIR_MODELS[@]}"
                QA_REPAIR_RESULT=$?
                if [[ "$QA_REPAIR_RESULT" -eq 0 ]]; then
                  run_validation
                else
                  PIPELINE_EXIT=1
                  echo "::error::QA reported a blocker but no repair model completed the fix stage."
                fi
              elif ! grep -Eiq '^QA_BLOCKER:[[:space:]]*NO' "$QA_LOG"; then
                PIPELINE_EXIT=1
                echo "::warning::QA output did not contain the required QA_BLOCKER header; treating QA as incomplete."
              fi
            fi

            if [[ "$VALIDATION_STATUS" -ne 0 ]]; then
              PIPELINE_EXIT=1
              echo "::error::Final deterministic validation did not pass."
            fi
          fi

          # Machine-readable per-run usage log plus a compact human report are
          # uploaded even if a required model stage is exhausted.
          {
            echo "# Pocket Habitat AI pipeline report"
            echo
            echo "- Run: ${GITHUB_RUN_NUMBER}"
            echo "- Task: ${TASK}"
            echo "- Execution mode: LIVE"
            echo "- Models configured: ${#MODEL_CHAIN[@]}"
            echo "- Automatic temporary-limit wait: ${TOTAL_TEMP_WAIT_SECONDS}s across ${TEMP_LIMIT_EVENTS} classified events"
            echo "- Daily/shared quota exhaustion events: ${DAILY_QUOTA_EVENTS}"
            echo "- Per-stage wait budget: ${STAGE_TEMP_WAIT_BUDGET_SECONDS}s; workflow-wide wait budget: ${TOTAL_TEMP_WAIT_BUDGET_SECONDS}s"
            echo
            echo "| Stage | Result | Model | Provider |"
            echo "|---|---|---|---|"
            for stage in implementation review review-fallback repair validation-repair qa qa-repair; do
              printf '| %s | %s | %s | %s |\n' "$stage" "${STAGE_STATUS[$stage]:-NOT RUN}" "${STAGE_MODEL[$stage]:-—}" "${STAGE_PROVIDER[$stage]:-—}"
            done
            printf '| deterministic-validation | %s | — | CI tools |\n' "${VALIDATION_STATUS:-NOT RUN}"
            echo
            echo "## Provider/model attempt log"
            echo
            echo 'See the accompanying TSV artifact for every attempted model, retry, and skip reason.'
            echo
            echo "## Testing boundaries"
            echo
            echo "- Automated checks executed: Rojo build, StyLua check on src/, Selene on src/."
            echo "- TestEZ, Roblox engine, multiplayer, and manual Studio testing are not claimed unless explicitly run by a separately supported test runner or human playtest."
            echo "- The .rbxl file is a build artifact only; a successful Rojo build does not prove the experience is playable in Roblox Studio."
          } > "$RUN_REPORT"

          if [[ -n "${GITHUB_STEP_SUMMARY:-}" ]]; then
            cat "$RUN_REPORT" >> "$GITHUB_STEP_SUMMARY"
          fi
          echo "===== PER-RUN MODEL USAGE ====="
          cat "$USAGE_LOG"
          echo "===== PIPELINE REPORT ====="
          cat "$RUN_REPORT"

          exit "$PIPELINE_EXIT"

      - name: Persist work to GitHub
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Vendored TestEZ/Wally source is not project-owned code. Restore it
          # if an agent or dependency command unexpectedly touched it.
          if [[ -n "$(git status --porcelain -- DevPackages)" ]]; then
            echo "::warning::Restoring unexpected changes and untracked files under vendored DevPackages."
            git restore --source=HEAD --staged --worktree -- DevPackages
            git clean -fd -- DevPackages
          fi

          git add -A
          if ! git diff --cached --quiet; then
            git commit -m "AI staged development checkpoint ${GITHUB_RUN_NUMBER}"
            git push origin HEAD:ai/game-build
          else
            echo "No repository changes to persist."
          fi

      - name: Save generated build and pipeline artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-habitat-pipeline-${{ github.run_number }}
          path: |
            build/pocket-habitat.rbxl
            ${{ runner.temp }}/pocket-habitat-agent-report.md
            ${{ runner.temp }}/pocket-habitat-model-usage.tsv
            ${{ runner.temp }}/pocket-habitat-validation.log
            ${{ runner.temp }}/opencode-*.log
          if-no-files-found: warn
          retention-days: 14
