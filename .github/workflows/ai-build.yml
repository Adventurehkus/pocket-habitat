name: Autonomous Roblox Builder

on:
  workflow_dispatch:
    inputs:
      task:
        description: Task for the autonomous development agent
        required: true
        type: string
        default: "Read AGENTS.md and continue the next incomplete milestone."

permissions:
  contents: write

concurrency:
  group: roblox-ai-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350

    steps:
      - name: Checkout AI build branch
        uses: actions/checkout@v7
        with:
          ref: ai/game-build
          persist-credentials: true

      - name: Install Roblox toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/rojo-rbx/rokit/main/scripts/install.sh | bash
          echo "$HOME/.rokit/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.rokit/bin:$PATH"
          rokit --version
          rokit install --no-trust-check
          wally install
          rojo --version
          stylua --version
          selene --version
          wally --version
          rojo build default.project.json -o "$RUNNER_TEMP/pocket-habitat-toolchain-check.rbxl"

      - name: Install OpenCode
        shell: bash
        run: |
          curl -fsSL https://opencode.ai/v2/install | bash
          export PATH="$HOME/.opencode/bin:$PATH"
          echo "$HOME/.opencode/bin" >> "$GITHUB_PATH"
          opencode --version

      - name: Run autonomous development agent with model fallback
        env:
          GOOGLE_GENERATIVE_AI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          TASK: ${{ inputs.task }}
        shell: bash
        run: |
          # GitHub Actions starts Bash with errexit enabled. Disable errexit in
          # this step so a provider's non-zero response can be classified and
          # routed to the next model instead of terminating the whole step.
          set +e
          set -uo pipefail

          # Ordered from preferred models to independent-provider fallbacks.
          # Models are added only when their provider credential is available.
          MODEL_CHAIN=()
          if [[ -n "${GOOGLE_GENERATIVE_AI_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "google/gemini-3.5-flash-lite"
              "google/gemini-3.1-flash-lite"
              "google/gemini-3.8-flash"
              "google/gemma-4-31b-it"
              "google/gemma-4-26b-a4b-it"
            )
          fi

          if [[ -n "${GROQ_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "groq/qwen/qwen3.8-27b"
              "groq/openai/gpt-oss-120b"
            )
          fi

          if [[ -n "${OPENROUTER_API_KEY:-}" ]]; then
            MODEL_CHAIN+=(
              "openrouter/nvidia/nemotron-3-ultra-550b-a55b:free"
              "openrouter/cohere/north-mini-code:free"
            )
          fi

          if [[ "${#MODEL_CHAIN[@]}" -eq 0 ]]; then
            echo "::error::No model provider credentials are configured."
            echo "Add GEMINI_API_KEY, and optionally GROQ_API_KEY and OPENROUTER_API_KEY, under repository Actions secrets."
            exit 1
          fi

          SESSION_ACTIVE=false
          RUN_COUNTER=0
          MAX_MINUTE_RETRIES=4

          for MODEL in "${MODEL_CHAIN[@]}"; do
            echo "::group::Model fallback: ${MODEL}"
            MODEL_RETRIES=0

            while true; do
              RUN_COUNTER=$((RUN_COUNTER + 1))
              LOG_FILE="$RUNNER_TEMP/opencode-${RUN_COUNTER}.log"
              echo "Running ${MODEL} (attempt $((MODEL_RETRIES + 1)) for this model)."

              if [[ "$SESSION_ACTIVE" == "false" ]]; then
                if opencode run \
                  --standalone \
                  --auto \
                  --model "$MODEL" \
                  --agent build \
                  "$TASK" 2>&1 | tee "$LOG_FILE"; then
                  STATUS=0
                else
                  STATUS=$?
                fi
              else
                if opencode run \
                  --standalone \
                  --auto \
                  --continue \
                  --model "$MODEL" \
                  --agent build \
                  "Continue the original task in this existing session. The previous model/provider reached a quota or temporary availability limit. Preserve all completed work, inspect the current repository state, do not restart or repeat completed work, and continue the original task to completion. You are now using fallback model $MODEL." \
                  2>&1 | tee "$LOG_FILE"; then
                  STATUS=0
                else
                  STATUS=$?
                fi
              fi
              SESSION_ACTIVE=true

              if [[ "$STATUS" -eq 0 ]]; then
                echo "OpenCode completed successfully using $MODEL."
                exit 0
              fi

              # A daily request/token cap cannot be fixed by waiting one minute.
              # Move directly to the next model, retaining this OpenCode session.
              if grep -Eiq 'requests per day|tokens per day|per-day limit|daily quota|daily limit|quota.*day|day.*quota|RPD|TPD' "$LOG_FILE"; then
                echo "::warning::Daily quota reached for $MODEL; switching to the next model."
                break
              fi

              # RPM/TPM limits are temporary. Wait for the provider's retry
              # hint, then resume the same session on the same model.
              if grep -Eiq 'requests per minute|tokens per minute|input tokens per minute|output tokens per minute|per-minute limit|requests-per-minute|tokens-per-minute' "$LOG_FILE"; then
                MODEL_RETRIES=$((MODEL_RETRIES + 1))

                if [[ "$MODEL_RETRIES" -gt "$MAX_MINUTE_RETRIES" ]]; then
                  echo "::warning::$MODEL remained rate-limited after $MAX_MINUTE_RETRIES retries; switching to the next model."
                  break
                fi

                RETRY_HINT=$(grep -Eio 'retry in [0-9]+([.][0-9]+)?s' "$LOG_FILE" | tail -n 1 | sed -E 's/.*retry in ([0-9]+([.][0-9]+)?)s/\1/i')
                if [[ -n "$RETRY_HINT" ]]; then
                  DELAY=$(awk -v s="$RETRY_HINT" 'BEGIN { d = int(s + 0.999) + 10; if (d < 20) d = 20; print d }')
                else
                  DELAY=65
                fi

                if [[ "$DELAY" -gt 600 ]]; then
                  echo "::warning::Provider retry delay is $DELAY seconds; switching to the next model instead of holding this slot."
                  break
                fi

                echo "Temporary RPM/TPM limit on $MODEL. Waiting ${DELAY}s, then continuing the same session."
                sleep "$DELAY"
                continue
              fi

              # Provider outages, auth errors, and unavailable model IDs should
              # not kill the entire chain when another configured provider exists.
              if grep -Eiq '429|RESOURCE_EXHAUSTED|rate.?limit|quota exceeded|temporarily unavailable|overloaded|service unavailable|HTTP 5[0-9][0-9]|unauthorized|invalid.*api.?key|API key.*invalid|HTTP 40[123]|model.*not found|no model is available|model unavailable|no longer available|not available to new users|retired model|deprecated model|high demand|spikes in demand|try again later|insufficient credits|not enough credits|payment required|context length|context window|input too long|maximum context' "$LOG_FILE"; then
                echo "::warning::$MODEL is unavailable or rejected the request; switching to the next model."
                break
              fi

              echo "::error::OpenCode failed for an error not recognized as a quota/provider availability issue (exit code $STATUS)."
              echo "Not switching models because this may be an actual task or tool failure."
              exit "$STATUS"
            done

            echo "::endgroup::"
          done

          echo "::error::Every configured fallback model was exhausted or unavailable."
          echo "Any changes already made will still be saved by the following persistence step."
          exit 1

      - name: Persist work to GitHub
        if: always()
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email \
            "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A

          if ! git diff --cached --quiet; then
            git commit -m "AI development checkpoint ${GITHUB_RUN_NUMBER}"
            git push origin HEAD:ai/game-build
          fi

      - name: Save generated build artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pocket-habitat-build-${{ github.run_number }}
          path: build/
          if-no-files-found: ignore
          retention-days: 14
